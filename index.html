            return `${y}-${m}-${day}`;

        const LEVEL_STEPS = [0, 40, 120, 260];
        const getLevelInfo = (exp) => {
            let level = 1;
            for (let i = 1; i < LEVEL_STEPS.length; i++) if (exp >= LEVEL_STEPS[i]) level = i + 1;
            const isMax = level >= LEVEL_STEPS.length;
            const base = LEVEL_STEPS[level - 1];
            const need = isMax ? 0 : LEVEL_STEPS[level] - base;
            const into = exp - base;
            return {
                level, isMax, into, need,
                progress: isMax ? 100 : Math.min(100, (into / need) * 100),
                stageIndex: Math.min(level - 1, 3)
            };
        };

        const TAB_DEFS = [
            { id: 'home', label: '寵物', icon: 'fa-paw' },
            { id: 'skincare', label: '保養', icon: 'fa-wand-magic-sparkles' },
            { id: 'health', label: '健康', icon: 'fa-heart-pulse' },
            { id: 'diet', label: '飲食', icon: 'fa-utensils' }
        ];
        const TABS = TAB_DEFS.map(t => t.id);
        const ZERO_EXPS = Object.fromEntries(Object.keys(PETS).map(k => [k, 0]));
        const DEFAULT_PROFILE = { gender: 'female', height: '', calorieGoal: '1500' };

        const defaultMeal = () => {
            const h = new Date().getHours();
            if (h < 10) return '早餐';
            if (h < 15) return '午餐';
            if (h < 17) return '點心';
            if (h < 21) return '晚餐';
            return '點心';
        };

        /* ---------- 體重趨勢圖 ---------- */
        const WeightChart = ({ points }) => {
            const W = 300, H = 110, P = 16;
            const ws = points.map(p => p.w);
            const min = Math.min(...ws), max = Math.max(...ws);
            const span = max - min || 1;
            const x = (i) => P + (points.length === 1 ? 0 : (i * (W - 2 * P)) / (points.length - 1));
            const y = (w) => H - P - ((w - min) / span) * (H - 2 * P);
            const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.w).toFixed(1)}`).join(' ');
            const first = points[0], last = points[points.length - 1];
            return (
                <div>
                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img"
                        aria-label={`最近 ${points.length} 筆體重，從 ${first.w} 公斤到 ${last.w} 公斤`}>
                        <path d={path} fill="none" stroke="var(--theme-color)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                        {points.map((p, i) => (
                            <circle key={p.date} cx={x(i)} cy={y(p.w)} r="3.5" fill="var(--theme-color)" />
                        ))}
                    </svg>
                    <div className="flex justify-between text-xs text-gray-400 mt-1">
                        <span>{first.date.slice(5)}</span>
                        <span>最低 {min} / 最高 {max} kg</span>
                        <span>{last.date.slice(5)}</span>
                    </div>
                </div>
            );
        };

        const App = () => {
            const todayStr = toLocalDateStr();
            const [date, setDate] = useState(todayStr);
            const [activeTab, setActiveTab] = useState('home');

            const [themeClass, setThemeClass] = useState('');
            const [quote, setQuote] = useState('');
            const [toast, setToast] = useState('');
            const toastTimerRef = useRef(null);

            const [lastActiveDate, setLastActiveDate] = useState(() => loadRaw('glowUpLastActive', ''));
            const [streak, setStreak] = useState(() => parseInt(loadRaw('glowUpStreak', '0')) || 0);
            const [lastBackup, setLastBackup] = useState(() => loadRaw('glowUpLastBackup', ''));

            // 加入防錯保護機制：確保即便儲存損壞，依然會回傳正確的物件 {}
            const [petNames, setPetNames] = useState(() => { const v = load('glowUpPetNames', {}); return isObj(v) ? v : {}; });
            const [petAccessories, setPetAccessories] = useState(() => { const v = load('glowUpPetAccessories', {}); return isObj(v) ? v : {}; });
            
            const [isNaming, setIsNaming] = useState(false);
            const [nameInput, setNameInput] = useState('');
            
            const [adventureStatus, setAdventureStatus] = useState('idle');
            const [adventureCountdown, setAdventureCountdown] = useState(0);
            const [adventureResult, setAdventureResult] = useState('');
            const [lastAdventureDate, setLastAdventureDate] = useState(() => loadRaw('glowUpLastAdventure', ''));

            const [petType, setPetType] = useState(() => {
                const t = loadRaw('glowUpPetType', 'penguin');
                return PETS[t] ? t : 'penguin';
            });
            const [petExps, setPetExps] = useState(() => {
                const saved = load('glowUpPetExps', null);
                if (isObj(saved)) return { ...ZERO_EXPS, ...saved };
                const oldExp = parseInt(loadRaw('glowUpPetExp', '0')) || 0;
                const cur = loadRaw('glowUpPetType', 'penguin');
                return { ...ZERO_EXPS, ...(PETS[cur] ? { [cur]: oldExp } : {}) };
            });

            const [interactionMsg, setInteractionMsg] = useState('');
            const [isInteracting, setIsInteracting] = useState(false);
            const [hearts, setHearts] = useState([]);
            const interactionTimerRef = useRef(null);

            const [time, setTime] = useState('morning');
            const [isEdit, setIsEdit] = useState(false);
            const [routines, setRoutines] = useState(() => normalizeRoutines(load('glowUpRoutines', null)));
            const [logs, setLogs] = useState(() => { const v = load('glowUpLogs', {}); return isObj(v) ? v : {}; });
            const [healthProfile, setHealthProfile] = useState(() => {
                const v = load('glowUpHealthProfile', {});
                return { ...DEFAULT_PROFILE, ...(isObj(v) ? v : {}) };
            });
            const [healthLogs, setHealthLogs] = useState(() => { const v = load('glowUpHealthLogs', {}); return isObj(v) ? v : {}; });
            const [dietLogs, setDietLogs] = useState(() => { const v = load('glowUpDietLogs', {}); return isObj(v) ? v : {}; });
            const [rewards, setRewards] = useState(() => { const v = load('glowUpRewards', {}); return isObj(v) ? v : {}; });
            const rewardsRef = useRef(rewards);

            const [activeFoodInputId, setActiveFoodInputId] = useState(null);
            const [foodSuggestions, setFoodSuggestions] = useState([]);

            const touchRef = useRef(null);

            /* ----- 初始化 ----- */
            useEffect(() => {
                setQuote(QUOTES[Math.floor(Math.random() * QUOTES.length)]);
                if (lastActiveDate && lastActiveDate !== todayStr) {
                    const y = new Date();
                    y.setDate(y.getDate() - 1);
                    if (lastActiveDate !== toLocalDateStr(y)) setStreak(0);
                }
            }, []);

            useEffect(() => {
                let timer;
                if (adventureStatus === 'exploring' && adventureCountdown > 0) {
                    timer = setTimeout(() => {
                        setAdventureCountdown(prev => prev - 1);
                    }, 1000);
                } else if (adventureStatus === 'exploring' && adventureCountdown === 0) {
                    setAdventureStatus('finished');
                    const loot = [
                        "發現了【✨ 亮麗寶石】！對保養充滿了靈感！",
                        "帶回了【🌿 蘆薈嫩葉】！可以敷保濕面膜喔～",
                        "採集到了【🍓 活力莓果】！補充豐富維他命 C！",
                        "撿到了【💎 幻光碎片】！感覺自己變得更精緻了！",
                        "發現了【🥛 補水泉水】！提醒你要多喝水喔！",
                        "聽到了大自然的悄悄話：『今天的你，真的很棒！』",
                        "找到了【🍀 幸運草】！今天會有好運發生～",
                        "遇到了一隻旅行的小青蛙，跟牠分享了保養心得！"
                    ];
                    const randLoot = loot[Math.floor(Math.random() * loot.length)];
                    setAdventureResult(randLoot);
                    addExp(5, '冒險尋寶');
                }
                return () => clearTimeout(timer);
            }, [adventureStatus, adventureCountdown]);

            useEffect(() => {
                const info = getLevelInfo(petExps[petType] || 0);
                if (info.isMax) {
                    setThemeClass('theme-maxlevel');
                } else {
                    const hour = new Date().getHours();
                    setThemeClass(hour >= 6 && hour < 18 ? 'theme-morning' : 'theme-night');
                }
            }, [petExps, petType]);

            /* ----- 儲存 ----- */
            usePersist('glowUpLastActive', lastActiveDate, true);
            usePersist('glowUpStreak', streak, true);
            usePersist('glowUpLastBackup', lastBackup, true);
            usePersist('glowUpPetType', petType, true);
            usePersist('glowUpPetNames', petNames);
            usePersist('glowUpPetAccessories', petAccessories);
            usePersist('glowUpLastAdventure', lastAdventureDate, true);
            usePersist('glowUpPetExps', petExps);
            usePersist('glowUpRoutines', routines);
            usePersist('glowUpLogs', logs);
            usePersist('glowUpHealthProfile', healthProfile);
            usePersist('glowUpHealthLogs', healthLogs);
            usePersist('glowUpDietLogs', dietLogs);
            usePersist('glowUpRewards', rewards);

            /* ----- 提示訊息 ----- */
            const showToast = (msg) => {
                setToast(msg);
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => setToast(''), 2200);
            };

            /* ----- 連續天數 / EXP ----- */
            const recordActivity = () => {
                if (lastActiveDate === todayStr) return;
                const y = new Date();
                y.setDate(y.getDate() - 1);
                if (lastActiveDate && lastActiveDate === toLocalDateStr(y)) {
                    setStreak(prev => prev + 1);
                } else {
                    setStreak(1);
                }
                setLastActiveDate(todayStr);
            };

            const addExp = (amount, source) => {
                setPetExps(prev => ({ ...prev, [petType]: (prev[petType] || 0) + amount }));
                showToast(`+${amount} EXP (${source})`);
                recordActivity();
            };

            const rewardOnce = (key, amount, source) => {
                if (date !== todayStr) return;
                const done = rewardsRef.current[date] || [];
                if (done.includes(key)) return;
                const next = { ...rewardsRef.current, [date]: [...done, key] };
                rewardsRef.current = next;
                setRewards(next);
                addExp(amount, source);
            };

            /* ----- 寵物 ----- */
            const petKeys = Object.keys(PETS);
            const currentPetIndex = petKeys.indexOf(petType);
            const handleNextPet = (e) => { e.stopPropagation(); setPetType(petKeys[(currentPetIndex + 1) % petKeys.length]); };
            const handlePrevPet = (e) => { e.stopPropagation(); setPetType(petKeys[(currentPetIndex - 1 + petKeys.length) % petKeys.length]); };

            const handlePetInteract = () => {
                const data = PETS[petType] || PETS.penguin;
                setInteractionMsg(data.dialogues[Math.floor(Math.random() * data.dialogues.length)]);
                setIsInteracting(true);

                const newHeart = { id: uid(), x: Math.random() * 40 - 20 };
                setHearts(prev => [...prev, newHeart]);
                setTimeout(() => setHearts(prev => prev.filter(h => h.id !== newHeart.id)), 1000);

                if (interactionTimerRef.current) clearTimeout(interactionTimerRef.current);
                interactionTimerRef.current = setTimeout(() => {
                    setInteractionMsg('');
                    setIsInteracting(false);
                }, 2500);
            };

            /* ----- 日期 ----- */
            const changeDate = (days) => {
                const d = parseLocalDate(date);
                d.setDate(d.getDate() + days);
                setDate(toLocalDateStr(d));
            };

            /* ----- 保養 ----- */
            const moveItem = (index, direction) => {
                const list = routines[time];
                const target = index + direction;
                if (target < 0 || target >= list.length) return;
                const next = [...list];
                [next[index], next[target]] = [next[target], next[index]];
                setRoutines(prev => ({ ...prev, [time]: next }));
            };
            const addItem = (iconItem) => {
                const newItem = { id: uid(), icon: iconItem.icon, name: iconItem.name, brand: '' };
                setRoutines(prev => ({ ...prev, [time]: [...prev[time], newItem] }));
            };
            const updateBrand = (id, val) => {
                setRoutines(prev => ({ ...prev, [time]: prev[time].map(item => item.id === id ? { ...item, brand: val } : item) }));
            };
            const deleteItem = (id) => {
                setRoutines(prev => ({ ...prev, [time]: prev[time].filter(item => item.id !== id) }));
            };
            const toggleLog = (itemId) => {
                const dayLogs = logs[date] || { morning: [], evening: [] };
                const timeLogs = dayLogs[time] || [];
                const isCompleted = timeLogs.includes(itemId);
                const next = isCompleted ? timeLogs.filter(id => id !== itemId) : [...timeLogs, itemId];
                setLogs(prev => ({ ...prev, [date]: { ...dayLogs, [time]: next } }));
                if (!isCompleted) rewardOnce(`skin:${time}:${itemId}`, 2, '保養');
            };

            /* ----- 健康 ----- */
            const handleGenderChange = (gender) => {
                setHealthProfile(prev => {
                    let newGoal = prev.calorieGoal;
                    if (prev.calorieGoal === '1500' && gender === 'male') newGoal = '2000';
                    if (prev.calorieGoal === '2000' && gender === 'female') newGoal = '1500';
                    return { ...prev, gender, calorieGoal: newGoal };
                });
            };
            const todayHealth = { weight: '', bodyFat: '', water: 0, ...(healthLogs[date] || {}) };
            const updateHealthLog = (field, value) => {
                setHealthLogs(prev => ({ ...prev, [date]: { weight: '', bodyFat: '', water: 0, ...(prev[date] || {}), [field]: value } }));
            };
            const changeWater = (delta, currentDisplayWater, goal) => {
                const next = Math.max(0, currentDisplayWater + delta);
                updateHealthLog('water', next);
                if (next >= goal) rewardOnce('water', 2, '喝水達標');
            };

            let bmi = '--';
            if (healthProfile.height && todayHealth.weight) {
                const h = parseFloat(healthProfile.height) / 100;
                const w = parseFloat(todayHealth.weight);
                if (h > 0 && w > 0) bmi = (w / (h * h)).toFixed(1);
            }
            const weightPoints = Object.keys(healthLogs).sort()
                .map(d => ({ date: d, w: parseFloat(healthLogs[d]?.weight) }))
                .filter(p => p.w > 0)
                .slice(-14);

            /* ----- 飲食 ----- */
            const todayDiet = dietLogs[date] || [];
            const patchDiet = (id, patch) => {
                setDietLogs(prev => ({ ...prev, [date]: (prev[date] || []).map(it => it.id === id ? { ...it, ...patch } : it) }));
            };
            const checkDietReward = (item) => {
                if ((item.food || '').trim() && parseFloat(item.calories) > 0) rewardOnce(`diet:${item.id}`, 3, '飲食');
            };
            const addDietRow = () => {
                const newItem = { id: uid(), meal: defaultMeal(), food: '', qty: '1', unit: '', base: null, calories: '' };
                setDietLogs(prev => ({ ...prev, [date]: [...(prev[date] || []), newItem] }));
            };
            const handleFoodInputChange = (item, value) => {
                patchDiet(item.id, { food: value, base: null, unit: '' });
                if (value.trim() !== '') {
                    setFoodSuggestions(FOOD_DB.filter(f => f.name.includes(value)).slice(0, 8));
                    setActiveFoodInputId(item.id);
                } else {
                    setFoodSuggestions([]);
                    setActiveFoodInputId(null);
                }
            };
            const selectFoodSuggestion = (item, food) => {
                const qty = parseFloat(item.qty) > 0 ? item.qty : '1';
                const patch = {
                    food: food.name, unit: food.unit, base: food.calories, qty,
                    calories: String(Math.round(food.calories * parseFloat(qty)))
                };
                patchDiet(item.id, patch);
                checkDietReward({ ...item, ...patch });
                setFoodSuggestions([]);
                setActiveFoodInputId(null);
            };
            const handleQtyChange = (item, value) => {
                const patch = { qty: value };
                if (item.base) patch.calories = String(Math.round(item.base * (parseFloat(value) || 0)));
                patchDiet(item.id, patch);
                checkDietReward({ ...item, ...patch });
            };
            const handleCaloriesChange = (item, value) => {
                const patch = { calories: value, base: null };
                patchDiet(item.id, patch);
                checkDietReward({ ...item, ...patch });
            };
            const deleteDietItem = (id) => {
                setDietLogs(prev => ({ ...prev, [date]: (prev[date] || []).filter(item => item.id !== id) }));
            };

            const totalCalories = todayDiet.reduce((sum, item) => sum + (parseFloat(item.calories) || 0), 0);
            const calGoal = parseFloat(healthProfile.calorieGoal) || 1500;
            const rawPercent = (totalCalories / calGoal) * 100;
            const isOver = rawPercent > 100;
            const barWidth = Math.min(rawPercent, 100);

            /* ----- 備份 / 還原 ----- */
            const exportData = async () => {
                const data = { lastActiveDate, streak, petType, petExps, routines, logs, healthProfile, healthLogs, dietLogs, rewards };
                const json = JSON.stringify(data, null, 2);
                const fileName = `GlowUp_Backup_${todayStr}.json`;
                try {
                    const file = new File([json], fileName, { type: 'application/json' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: 'Glow Up 備份' });
                    } else {
                        const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                    }
                    setLastBackup(todayStr);
                    showToast('備份完成，請妥善保存檔案');
                } catch (err) {
                    if (err && err.name === 'AbortError') return; // 使用者取消分享
                    showToast('備份失敗，請再試一次');
                }
            };

            const importData = (event) => {
                const file = event.target.files && event.target.files[0];
                event.target.value = ''; // 允許重複選同一個檔案
                if (!file) return;
                if (!window.confirm('匯入會覆蓋目前所有資料，要繼續嗎？')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        const validRoutines = isObj(data.routines) && Array.isArray(data.routines.morning) && Array.isArray(data.routines.evening);
                        if (!isObj(data) || typeof data.streak !== 'number' || !PETS[data.petType] || !validRoutines) {
                            showToast('檔案格式不正確');
                            return;
                        }
                        rewardsRef.current = isObj(data.rewards) ? data.rewards : {};
                        setLastActiveDate(typeof data.lastActiveDate === 'string' ? data.lastActiveDate : '');
                        setStreak(data.streak);
                        setPetType(data.petType);
                        setPetExps({ ...ZERO_EXPS, ...(isObj(data.petExps) ? data.petExps : {}) });
                        setRoutines(normalizeRoutines(data.routines));
                        setLogs(isObj(data.logs) ? data.logs : {});
                        setHealthProfile({ ...DEFAULT_PROFILE, ...(isObj(data.healthProfile) ? data.healthProfile : {}) });
                        setHealthLogs(isObj(data.healthLogs) ? data.healthLogs : {});
                        setDietLogs(isObj(data.dietLogs) ? data.dietLogs : {});
                        setRewards(rewardsRef.current);
                        showToast('資料還原成功');
                    } catch {
                        showToast('讀取檔案失敗');
                    }
                };
                reader.onerror = () => showToast('讀取檔案失敗');
                reader.readAsText(file, 'UTF-8');
            };

            const daysSinceBackup = lastBackup ? Math.floor((parseLocalDate(todayStr) - parseLocalDate(lastBackup)) / 86400000) : null;
            const hasData = streak > 0 || Object.values(petExps).some(v => v > 0) || Object.keys(logs).length > 0;
            const needBackup = hasData && (daysSinceBackup === null || daysSinceBackup >= 7);

            /* ----- 滑動切頁 ----- */
            const onTouchStart = (e) => {
                if (e.target.closest && e.target.closest('input, select, textarea')) {
                    touchRef.current = null;
                    return;
                }
                const t = e.touches[0];
                touchRef.current = { x: t.clientX, y: t.clientY };
            };
            const onTouchEnd = (e) => {
                const start = touchRef.current;
                touchRef.current = null;
                if (!start) return;
                const t = e.changedTouches[0];
                const dx = t.clientX - start.x;
                const dy = t.clientY - start.y;
                if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
                const i = TABS.indexOf(activeTab);
                if (dx < 0 && i < TABS.length - 1) setActiveTab(TABS[i + 1]);
                if (dx > 0 && i > 0) setActiveTab(TABS[i - 1]);
            };

            const handleContentClick = () => {
                if (foodSuggestions.length > 0) {
                    setFoodSuggestions([]);
                    setActiveFoodInputId(null);
                }
            };

            /* ----- 寵物顯示資料 ----- */
            const biomes = {
                penguin: { title: '冰雪城堡 ❄️🏔️', style: 'from-[#0b1b3d] to-[#113a5d] border-[#103f68]', decor: '🌨️✨' },
                bird: { title: '森林派對 🌿🌳', style: 'from-[#0d3b2e] to-[#0f4d19] border-[#135a20]', decor: '🍃🎋' },
                snail: { title: '奇幻花園 🌸🍄', style: 'from-[#1a0f3d] to-[#3a0d33] border-[#441144]', decor: '🏵️🌱' },
                sheep: { title: '雲朵樂園 ☁️🎠', style: 'from-[#2e0854] to-[#4c123d] border-[#591655]', decor: '🌸☁️' },
                cat: { title: '霓虹夜幕 🌌🌃', style: 'from-[#190d3d] to-[#3b0a6e] border-[#4a09a3]', decor: '⚡🌟' },
                dog: { title: '宇宙探險 🚀☄️', style: 'from-[#051329] to-[#121c40] border-[#182354]', decor: '🌌🪐' }
            };
            const currentBiome = biomes[petType] || biomes.penguin;
            const todayWater = healthLogs[todayStr]?.water || 0;
            const currentDisplayWater = todayWater < 50 && todayWater > 0 ? todayWater * 250 : todayWater;
            const currentWeightVal = parseFloat(healthLogs[todayStr]?.weight) || (weightPoints.length > 0 ? weightPoints[weightPoints.length-1].w : 0);
            const wtGoal = currentWeightVal > 0 ? Math.round(currentWeightVal * 30) : 2000;
            const statWater = Math.min(100, Math.round((currentDisplayWater / wtGoal) * 100)) || 0;
            
            const routineList = routines[time] || [];
            const completedRoutines = logs[date]?.[time] || [];
            const statBeauty = routineList.length > 0 ? Math.min(100, Math.round((completedRoutines.length / routineList.length) * 100)) : 0;
            const statEnergy = Math.min(100, (todayDiet.length * 30) + 30);

            const exp = petExps[petType] || 0;
            const info = getLevelInfo(exp);
            const currentPet = PETS[petType] || PETS.penguin;
            const petEmoji = currentPet.stages[info.stageIndex];

            const getPetSize = () => {
                if (info.isMax) return 'text-9xl';
                if (info.level === 3) return 'text-8xl';
                if (info.level === 2) return 'text-7xl';
                return 'text-6xl';
            };

            const getPetMood = () => {
                const hour = new Date().getHours();
                const isNight = hour >= 22 || hour < 5;
                const l = logs[todayStr];
                const h = healthLogs[todayStr];
                const hasLogsToday = (l && (l.morning?.length > 0 || l.evening?.length > 0)) ||
                    (h && (h.weight || h.bodyFat || h.water > 0)) ||
                    (dietLogs[todayStr] && dietLogs[todayStr].length > 0);
                if (info.isMax) return '👑';
                if (isNight) return '💤';
                if (hasLogsToday) return '✨';
                return '💭';

                    if (adventureStatus === 'exploring') return;
                    setAdventureStatus('exploring');
                    setAdventureCountdown(8);

                            <div className="absolute top-2 right-3 text-lg opacity-40 select-none animate-pulse">{currentBiome.decor}</div>

                                        <div className="flex items-center space-x-1" onClick={e => e.stopPropagation()}>

                                                maxLength={8}
                                                value={nameInput} 
                                                onChange={(e) => setNameInput(e.target.value)}
                                                className="bg-black/60 text-white text-base px-2 py-1 rounded border border-blue-400 focus:outline-none w-24"

                                        <div className="flex items-center space-x-1 bg-black/40 px-3 py-1.5 rounded-full border border-white/10">
                                            <span className="font-extrabold text-white text-base">{currentCustomName}</span>
                                            <button type="button" aria-label="重命名" onClick={handleRename} className="text-gray-400 hover:text-blue-400 ml-1 text-xs">
                                                <i className="fas fa-edit"></i>
                                            </button>
                                        </div>

                                </div>
                                
                                {streak > 0 && (
                                    <div className="flex items-center text-xs font-bold bg-black/40 px-3 py-1.5 rounded-full border border-orange-500/30">

                                        連續 <span className="text-orange-400 mx-1">{streak}</span> 天

                            </div>

                                onClick={(e) => { e.stopPropagation(); handlePetInteract(); }}
                            >
                                <div className={`absolute -top-1 right-1/4 bg-black/80 border border-white/20 rounded-full px-4 py-1.5 text-xs shadow-lg z-20 ${interactionMsg ? 'border-blue-400 text-blue-300 animate-bounce font-bold' : 'animate-bounce-slight'}`}>
                                    {interactionMsg || getPetMood()}
                                </div>

                                {hearts.map(heart => (

                                    <span className={`${getPetSize()} select-none z-10 relative`}>{petEmoji}</span>
                                    
                                    {activeAccessory !== 'none' && (

                                    <span className="text-[10px] font-bold text-amber-300 mt-1">{statEnergy}%</span>
                                </div>
                            </div>

                        </div>

                        {/* 特色：尋寶冒險 */}
                        <div className="w-full mt-4 bg-cardBg border border-gray-800 rounded-2xl p-4 flex flex-col relative overflow-hidden shadow-md">

                                    <span className="text-base font-bold text-gray-200">
                                        <i className="fas fa-compass text-amber-400 mr-2"></i>冒險探險
                                    </span>
                                    <span className="text-xs text-gray-400">派 {currentCustomName} 探索，隨機帶回驚喜 (每日 +5 EXP)</span>
                                </div>
                                {adventureStatus === 'idle' && (
                                    <button 
                                        onClick={startAdventure}
                                        className="bg-amber-500 hover:bg-amber-400 text-black text-xs font-bold px-4 py-2 rounded
