                                <div className="text-right">
                                    <span className="text-4xl font-black neon-text-theme drop-shadow-md">{Math.round(totalCalories)}</span>
                                    <span className="text-base font-bold text-gray-300 ml-2">/ {calGoal} kcal</span>
                                </div>
                            </div>
                            <div className="w-full bg-gray-900 rounded-full h-5 shadow-inset-theme mt-1 border border-gray-700" role="progressbar" aria-valuemin="0" aria-valuemax={calGoal} aria-valuenow={Math.round(totalCalories)}>
                                <div className={`h-5 rounded-full transition-all duration-500 ease-out ${isOver ? 'bg-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.8)]' : 'neon-bg-theme shadow-theme'}`} style={{ width: `${barWidth}%` }}></div>
                            </div>
                            {isOver && <p className="text-amber-400 text-base font-bold text-right mt-3 bg-amber-500/10 inline-block self-end px-3 py-1.5 rounded-lg">今天超過目標了，明天再慢慢調整就好。</p>}
                        </div>
                    </div>
                );
            };

            return (
                <div className={`app-shell flex flex-col max-w-md mx-auto relative overflow-hidden bg-darkBg text-white swipe-container ${themeClass}`} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
                    <div className="sr-only" role="status" aria-live="polite">{toast}</div>
                    {toast && (
                        <div aria-hidden="true" className="absolute top-24 left-1/2 transform -translate-x-1/2 z-50 neon-bg-theme text-white px-6 py-3 rounded-full font-black text-lg shadow-theme animate-bounce whitespace-nowrap border-2 border-white/20">
                            {toast}
                        </div>
                    )}

                    <div className="p-4 pb-2 shrink-0">
                        <h1 className="text-3xl font-black italic tracking-wider neon-text-light text-center mb-6 mt-2">Delicate Glow Up</h1>
                        <div className="flex justify-center items-center space-x-4">
                            <button type="button" aria-label="前一天" onClick={() => changeDate(-1)} className="min-tap-target w-14 h-14 rounded-full bg-cardBg border-2 border-gray-700 hover:neon-border-theme flex items-center justify-center text-gray-200 hover:text-white transition-colors shadow-md">
                                <i className="fas fa-chevron-left text-xl"></i>
                            </button>
                            <div className="relative hover:neon-border-theme rounded-full transition-colors flex-1 max-w-[200px]">
                                <div className="bg-cardBg border-2 border-gray-700 rounded-full py-3 text-center text-xl font-black flex items-center justify-center neon-text-theme cursor-pointer shadow-md w-full">
                                    {date} <i className="fas fa-calendar-alt ml-3 opacity-60 text-lg"></i>
                                </div>
                                <input type="date" aria-label="選擇日期" value={date} onChange={(e) => { if (e.target.value) setDate(e.target.value); }} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer min-tap-target" />
                            </div>
                            <button type="button" aria-label="後一天" onClick={() => changeDate(1)} className="min-tap-target w-14 h-14 rounded-full bg-cardBg border-2 border-gray-700 hover:neon-border-theme flex items-center justify-center text-gray-200 hover:text-white transition-colors shadow-md">
                                <i className="fas fa-chevron-right text-xl"></i>
                            </button>
                        </div>
                    </div>

                    <div className="flex px-2 mt-4 mb-2 shrink-0 border-b-2 border-gray-800" role="tablist">
                        {TAB_DEFS.map(t => (
                            <button key={t.id} type="button" role="tab" aria-selected={activeTab === t.id} className={`min-tap-target flex-1 pb-4 pt-2 text-lg font-black transition-all ${activeTab === t.id ? 'neon-text-theme border-b-[3px] neon-border-theme' : 'text-gray-400 hover:text-gray-200'}`} onClick={() => setActiveTab(t.id)}>
                                <i className={`fas ${t.icon} mr-1.5 text-xl`}></i> <br className="block sm:hidden" />{t.label}
                            </button>
                        ))}
                    </div>

                    <div className="flex-1 overflow-y-auto px-5 pb-8 pt-2" role="tabpanel">
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'skincare' && renderSkincare()}
                        {activeTab === 'health' && renderHealth()}
                        {activeTab === 'diet' && renderDiet()}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
