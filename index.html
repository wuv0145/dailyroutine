            return `${y}-${m}-${day}`;

        ].map(([name, calories, unit]) => ({ name, calories, unit }));

        // 升級所需累積 EXP: Lv1 起算, 最後一項為滿級門檻
        const LEVEL_STEPS = [0, 40, 120, 260];
        const getLevelInfo = (exp) => {
            let level = 1;
            for (let i = 1; i < LEVEL_STEPS.length; i++) if (exp >= LEVEL_STEPS[i]) level = i + 1;
            const isMax = level >= LEVEL_STEPS.length;
            const base = LEVEL_STEPS[level - 1];
            const need = isMax ? 0 : LEVEL_STEPS[level] - base;
            const into = exp - base;
            return {
                level, isMax, into, need,
                progress: isMax ? 100 : Math.min(100, (into / need) * 100),
                stageIndex: Math.min(level - 1, 3)
            };
        };

        
        const TAB_DEFS = [
            { id: 'home', label: '寵物', icon: 'fa-paw' },
            { id: 'skincare', label: '保養', icon: 'fa-wand-magic-sparkles' },
            { id: 'health', label: '健康', icon: 'fa-heart-pulse' },
            { id: 'diet', label: '飲食', icon: 'fa-utensils' }
        ];
        const TABS = TAB_DEFS.map(t => t.id);
        const ZERO_EXPS = Object.fromEntries(Object.keys(PETS).map(k => [k, 0]));
        const DEFAULT_PROFILE = { gender: 'female', height: '', calorieGoal: '1500' };

        const defaultMeal = () => {
            const h = new Date().getHours();
            if (h < 10) return '早餐';
            if (h < 15) return '午餐';
            if (h < 17) return '點心';
            if (h < 21) return '晚餐';
            return '點心';
        };

        /* ---------- 體重趨勢圖 ---------- */
        const WeightChart = ({ points }) => {
            const W = 300, H = 110, P = 16;
            const ws = points.map(p => p.w);
            const min = Math.min(...ws), max = Math.max(...ws);
            const span = max - min || 1;
            const x = (i) => P + (points.length === 1 ? 0 : (i * (W - 2 * P)) / (points.length - 1));
            const y = (w) => H - P - ((w - min) / span) * (H - 2 * P);
            const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.w).toFixed(1)}`).join(' ');
            const first = points[0], last = points[points.length - 1];
            return (
                <div>
                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img"
                        aria-label={`最近 ${points.length} 筆體重，從 ${first.w} 公斤到 ${last.w} 公斤`}>
                        <path d={path} fill="none" stroke="var(--theme-color)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                        {points.map((p, i) => (
                            <circle key={p.date} cx={x(i)} cy={y(p.w)} r="3.5" fill="var(--theme-color)" />
                        ))}
                    </svg>
                    <div className="flex justify-between text-xs text-gray-400 mt-1">
                        <span>{first.date.slice(5)}</span>
                        <span>最低 {min} / 最高 {max} kg</span>
                        <span>{last.date.slice(5)}</span>
                    </div>
                </div>
            );
        };

        const App = () => {
            const todayStr = toLocalDateStr();
            const [date, setDate] = useState(todayStr);
            const [activeTab, setActiveTab] = useState('home');

            const [themeClass, setThemeClass] = useState('');
            const [quote, setQuote] = useState('');
            const [toast, setToast] = useState('');
            const toastTimerRef = useRef(null);

            const [lastActiveDate, setLastActiveDate] = useState(() => loadRaw('glowUpLastActive', ''));
            const [streak, setStreak] = useState(() => parseInt(loadRaw('glowUpStreak', '0')) || 0);
            const [lastBackup, setLastBackup] = useState(() => loadRaw('glowUpLastBackup', ''));

            const [petType, setPetType] = useState(() => {
                const t = loadRaw('glowUpPetType', 'penguin');
                return PETS[t] ? t : 'penguin';
            });
            const [petExps, setPetExps] = useState(() => {
                const saved = load('glowUpPetExps', null);
                if (isObj(saved)) return { ...ZERO_EXPS, ...saved };
                // 舊版單一 EXP 的遷移
                const oldExp = parseInt(loadRaw('glowUpPetExp', '0')) || 0;
                const cur = loadRaw('glowUpPetType', 'penguin');
                return { ...ZERO_EXPS, ...(PETS[cur] ? { [cur]: oldExp } : {}) };
            });

            const [interactionMsg, setInteractionMsg] = useState('');
            const [isInteracting, setIsInteracting] = useState(false);
            const [hearts, setHearts] = useState([]);
            const interactionTimerRef = useRef(null);

            const [time, setTime] = useState('morning');
            const [isEdit, setIsEdit] = useState(false);
            const [routines, setRoutines] = useState(() => normalizeRoutines(load('glowUpRoutines', null)));
            const [logs, setLogs] = useState(() => { const v = load('glowUpLogs', {}); return isObj(v) ? v : {}; });
            const [healthProfile, setHealthProfile] = useState(() => {
                const v = load('glowUpHealthProfile', {});
                return { ...DEFAULT_PROFILE, ...(isObj(v) ? v : {}) };
            });
            const [healthLogs, setHealthLogs] = useState(() => { const v = load('glowUpHealthLogs', {}); return isObj(v) ? v : {}; });
            const [dietLogs, setDietLogs] = useState(() => { const v = load('glowUpDietLogs', {}); return isObj(v) ? v : {}; });
            const [rewards, setRewards] = useState(() => { const v = load('glowUpRewards', {}); return isObj(v) ? v : {}; });
            const rewardsRef = useRef(rewards);

            const [activeFoodInputId, setActiveFoodInputId] = useState(null);
            const [foodSuggestions, setFoodSuggestions] = useState([]);

            // 滑動切頁: 使用 ref, 不會觸發重繪
            const touchRef = useRef(null);

            /* ----- 初始化 ----- */
            useEffect(() => {
                setQuote(QUOTES[Math.floor(Math.random() * QUOTES.length)]);
                if (lastActiveDate && lastActiveDate !== todayStr) {
                    const y = new Date();
                    y.setDate(y.getDate() - 1);
                    if (lastActiveDate !== toLocalDateStr(y)) setStreak(0);
                }
            }, []);

            useEffect(() => {
                const info = getLevelInfo(petExps[petType] || 0);
                if (info.isMax) {
                    setThemeClass('theme-maxlevel');
                } else {
                    const hour = new Date().getHours();
                    setThemeClass(hour >= 6 && hour < 18 ? 'theme-morning' : 'theme-night');
                }
            }, [petExps, petType]);

            /* ----- 儲存 ----- */
            usePersist('glowUpLastActive', lastActiveDate, true);
            usePersist('glowUpStreak', streak, true);
            usePersist('glowUpLastBackup', lastBackup, true);
            usePersist('glowUpPetType', petType, true);
            usePersist('glowUpPetExps', petExps);
            usePersist('glowUpRoutines', routines);
            usePersist('glowUpLogs', logs);
            usePersist('glowUpHealthProfile', healthProfile);
            usePersist('glowUpHealthLogs', healthLogs);
            usePersist('glowUpDietLogs', dietLogs);
            usePersist('glowUpRewards', rewards);

            /* ----- 提示訊息 ----- */
            const showToast = (msg) => {
                setToast(msg);
                if (toastTimerRef.current) clearTimeout(toastTimerRef.current);
                toastTimerRef.current = setTimeout(() => setToast(''), 2200);
            };

            /* ----- 連續天數 / EXP ----- */
            const recordActivity = () => {
                if (lastActiveDate === todayStr) return;
                const y = new Date();
                y.setDate(y.getDate() - 1);
                if (lastActiveDate && lastActiveDate === toLocalDateStr(y)) {
                    setStreak(prev => prev + 1);
                } else {
                    setStreak(1);
                }
                setLastActiveDate(todayStr);
            };

            const addExp = (amount, source) => {
                setPetExps(prev => ({ ...prev, [petType]: (prev[petType] || 0) + amount }));
                showToast(`+${amount} EXP (${source})`);
                recordActivity();
            };

            // 每個項目在指定日期只給一次 EXP (開放補登，鼓勵使用者補齊紀錄)
            const rewardOnce = (key, amount, source) => {
                const done = rewardsRef.current[date] || [];
                if (done.includes(key)) return;
                const next = { ...rewardsRef.current, [date]: [...done, key] };
                rewardsRef.current = next;
                setRewards(next);
                addExp(amount, source);
            };

            /* ----- 寵物 ----- */
            const petKeys = Object.keys(PETS);
            const currentPetIndex = petKeys.indexOf(petType);
            const handleNextPet = (e) => { e.stopPropagation(); setPetType(petKeys[(currentPetIndex + 1) % petKeys.length]); };
            const handlePrevPet = (e) => { e.stopPropagation(); setPetType(petKeys[(currentPetIndex - 1 + petKeys.length) % petKeys.length]); };

            const handlePetInteract = () => {
                const data = PETS[petType] || PETS.penguin;
                setInteractionMsg(data.dialogues[Math.floor(Math.random() * data.dialogues.length)]);
                setIsInteracting(true);

                const newHeart = { id: uid(), x: Math.random() * 40 - 20, emoji: '❤️' };
                setHearts(prev => [...prev, newHeart]);
                setTimeout(() => setHearts(prev => prev.filter(h => h.id !== newHeart.id)), 1000);

                if (interactionTimerRef.current) clearTimeout(interactionTimerRef.current);
                interactionTimerRef.current = setTimeout(() => {
                    setInteractionMsg('');
                    setIsInteracting(false);
                }, 2800);
            };

            const playInteract = (actionType) => {
                if (isInteracting) return; // 防呆：避免狂點造成效能問題與粒子暴增
                const data = PETS[petType] || PETS.penguin;
                const act = data.interactions[actionType];
                if (!act) return;
                
                setInteractionMsg(act.dialogue);
                setIsInteracting(true);
                
                // Spawn customized behavior particles
                const emojiToUse = act.emoji;
                const particles = Array.from({ length: 4 }).map((_, idx) => ({
                    id: uid() + idx,
                    x: (Math.random() * 70 - 35),
                    y: (Math.random() * -30 - 10),
                    emoji: emojiToUse
                }));
                
                setHearts(prev => [...prev, ...particles]);
                particles.forEach(p => {
                    setTimeout(() => setHearts(prev => prev.filter(h => h.id !== p.id)), 1200);
                });

                // Grant 1 small fun EXP once a day per action type to reward active pet bonding!
                rewardOnce(`petbond:${petType}:${actionType}`, 1, `與夥伴 ${actionType === 'feed' ? '餵食' : actionType === 'play' ? '特技' : '休息'} 互動`);

                if (interactionTimerRef.current) clearTimeout(interactionTimerRef.current);
                interactionTimerRef.current = setTimeout(() => {
                    setInteractionMsg('');
                    setIsInteracting(false);
                }, 3500);
            };

            /* ----- 日期 ----- */
            const changeDate = (days) => {
                const d = parseLocalDate(date);
                d.setDate(d.getDate() + days);
                setDate(toLocalDateStr(d));
            };

            /* ----- 保養 ----- */
            const moveItem = (index, direction) => {
                const list = routines[time];
                const target = index + direction;
                if (target < 0 || target >= list.length) return;
                const next = [...list];
                [next[index], next[target]] = [next[target], next[index]];
                setRoutines(prev => ({ ...prev, [time]: next }));
            };
            const addItem = (iconItem) => {
                const newItem = { id: uid(), icon: iconItem.icon, name: iconItem.name, brand: '' };
                setRoutines(prev => ({ ...prev, [time]: [...prev[time], newItem] }));
            };
            const updateBrand = (id, val) => {
                setRoutines(prev => ({ ...prev, [time]: prev[time].map(item => item.id === id ? { ...item, brand: val } : item) }));
            };
            const deleteItem = (id) => {
                setRoutines(prev => ({ ...prev, [time]: prev[time].filter(item => item.id !== id) }));
            };
            const toggleLog = (itemId) => {
                const dayLogs = logs[date] || { morning: [], evening: [] };
                const timeLogs = dayLogs[time] || [];
                const isCompleted = timeLogs.includes(itemId);
                const next = isCompleted ? timeLogs.filter(id => id !== itemId) : [...timeLogs, itemId];
                setLogs(prev => ({ ...prev, [date]: { ...dayLogs, [time]: next } }));
                if (!isCompleted) rewardOnce(`skin:${time}:${itemId}`, 2, '保養');
            };

            /* ----- 健康 ----- */
            const handleGenderChange = (gender) => {
                setHealthProfile(prev => {
                    let newGoal = prev.calorieGoal;
                    if (prev.calorieGoal === '1500' && gender === 'male') newGoal = '2000';
                    if (prev.calorieGoal === '2000' && gender === 'female') newGoal = '1500';
                    return { ...prev, gender, calorieGoal: newGoal };
                });
            };
            const todayHealth = { weight: '', bodyFat: '', water: 0, ...(healthLogs[date] || {}) };
            const updateHealthLog = (field, value) => {
                setHealthLogs(prev => ({ ...prev, [date]: { weight: '', bodyFat: '', water: 0, ...(prev[date] || {}), [field]: value } }));
            };
            const changeWater = (delta, currentDisplayWater, goal) => {
                const next = Math.max(0, currentDisplayWater + delta);
                updateHealthLog('water', next);
                if (next >= goal) rewardOnce('water', 2, '喝水達標');
            };

            let bmi = '--';
            if (healthProfile.height && todayHealth.weight) {
                const h = parseFloat(healthProfile.height) / 100;
                const w = parseFloat(todayHealth.weight);
                if (h > 0 && w > 0) bmi = (w / (h * h)).toFixed(1);
            }
            const weightPoints = Object.keys(healthLogs).sort()
                .map(d => ({ date: d, w: parseFloat(healthLogs[d]?.weight) }))
                .filter(p => p.w > 0)
                .slice(-14);

            /* ----- 飲食 ----- */
            const todayDiet = dietLogs[date] || [];
            const patchDiet = (id, patch) => {
                setDietLogs(prev => ({ ...prev, [date]: (prev[date] || []).map(it => it.id === id ? { ...it, ...patch } : it) }));
            };
            const checkDietReward = (item) => {
                if ((item.food || '').trim() && parseFloat(item.calories) > 0) rewardOnce(`diet:${item.id}`, 3, '飲食');
            };
            const addDietRow = () => {
                const newItem = { id: uid(), meal: defaultMeal(), food: '', qty: '1', unit: '', base: null, calories: '' };
                setDietLogs(prev => ({ ...prev, [date]: [...(prev[date] || []), newItem] }));
            };
            const handleFoodInputChange = (item, value) => {
                patchDiet(item.id, { food: value, base: null, unit: '' });
                if (value.trim() !== '') {
                    setFoodSuggestions(FOOD_DB.filter(f => f.name.includes(value)).slice(0, 8));
                    setActiveFoodInputId(item.id);
                } else {
                    setFoodSuggestions([]);
                    setActiveFoodInputId(null);
                }
            };
            const selectFoodSuggestion = (item, food) => {
                const qty = parseFloat(item.qty) > 0 ? item.qty : '1';
                const patch = {
                    food: food.name, unit: food.unit, base: food.calories, qty,
                    calories: String(Math.round(food.calories * parseFloat(qty)))
                };
                patchDiet(item.id, patch);
                checkDietReward({ ...item, ...patch });
                setFoodSuggestions([]);
                setActiveFoodInputId(null);
            };
            const handleQtyChange = (item, value) => {
                const patch = { qty: value };
                if (item.base) patch.calories = String(Math.round(item.base * (parseFloat(value) || 0)));
                patchDiet(item.id, patch);
                checkDietReward({ ...item, ...patch });
            };
            const handleCaloriesChange = (item, value) => {
                const patch = { calories: value, base: null };
                patchDiet(item.id, patch);
                checkDietReward({ ...item, ...patch });
            };
            const deleteDietItem = (id) => {
                setDietLogs(prev => ({ ...prev, [date]: (prev[date] || []).filter(item => item.id !== id) }));
            };

            const totalCalories = todayDiet.reduce((sum, item) => sum + (parseFloat(item.calories) || 0), 0);
            const calGoal = parseFloat(healthProfile.calorieGoal) || 1500;
            const rawPercent = (totalCalories / calGoal) * 100;
            const isOver = rawPercent > 100;
            const barWidth = Math.min(rawPercent, 100);

            /* ----- 備份 / 還原 ----- */
            const exportData = async () => {
                const data = { lastActiveDate, streak, petType, petExps, routines, logs, healthProfile, healthLogs, dietLogs, rewards };
                const json = JSON.stringify(data, null, 2);
                const fileName = `GlowUp_Backup_${todayStr}.json`;
                try {
                    const file = new File([json], fileName, { type: 'application/json' });
                    if (navigator.canShare && navigator.canShare({ files: [file] })) {
                        await navigator.share({ files: [file], title: 'Glow Up 備份' });
                    } else {
                        const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
                        const a = document.createElement('a');
                        a.href = url;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        a.remove();
                        setTimeout(() => URL.revokeObjectURL(url), 1000);
                    }
                    setLastBackup(todayStr);
                    showToast('備份完成，請妥善保存檔案');
                } catch (err) {
                    if (err && err.name === 'AbortError') return; // 使用者取消分享
                    showToast('備份失敗，請再試一次');
                }
            };

            const importData = (event) => {
                const file = event.target.files && event.target.files[0];
                event.target.value = ''; // 允許重複選同一個檔案
                if (!file) return;
                if (!window.confirm('匯入會覆蓋目前所有資料，要繼續嗎？')) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        const validRoutines = isObj(data.routines) && Array.isArray(data.routines.morning) && Array.isArray(data.routines.evening);
                        if (!isObj(data) || typeof data.streak !== 'number' || !PETS[data.petType] || !validRoutines) {
                            showToast('檔案格式不正確');
                            return;
                        }
                        rewardsRef.current = isObj(data.rewards) ? data.rewards : {};
                        setLastActiveDate(typeof data.lastActiveDate === 'string' ? data.lastActiveDate : '');
                        setStreak(data.streak);
                        setPetType(data.petType);
                        setPetExps({ ...ZERO_EXPS, ...(isObj(data.petExps) ? data.petExps : {}) });
                        setRoutines(normalizeRoutines(data.routines));
                        setLogs(isObj(data.logs) ? data.logs : {});
                        setHealthProfile({ ...DEFAULT_PROFILE, ...(isObj(data.healthProfile) ? data.healthProfile : {}) });
                        setHealthLogs(isObj(data.healthLogs) ? data.healthLogs : {});
                        setDietLogs(isObj(data.dietLogs) ? data.dietLogs : {});
                        setRewards(rewardsRef.current);
                        showToast('資料還原成功');
                    } catch {
                        showToast('讀取檔案失敗');
                    }
                };
                reader.onerror = () => showToast('讀取檔案失敗');
                reader.readAsText(file, 'UTF-8');
            };

            const daysSinceBackup = lastBackup ? Math.floor((parseLocalDate(todayStr) - parseLocalDate(lastBackup)) / 86400000) : null;
            const hasData = streak > 0 || Object.values(petExps).some(v => v > 0) || Object.keys(logs).length > 0;
            const needBackup = hasData && (daysSinceBackup === null || daysSinceBackup >= 7);

            /* ----- 滑動切頁 ----- */
            const onTouchStart = (e) => {
                if (e.target.closest && e.target.closest('input, select, textarea, .autocomplete-list, .autocomplete-item')) {
                    touchRef.current = null;
                    return;
                }
                const t = e.touches[0];
                touchRef.current = { x: t.clientX, y: t.clientY };
            };
            const onTouchEnd = (e) => {
                const start = touchRef.current;
                touchRef.current = null;
                if (!start) return;
                const t = e.changedTouches[0];
                const dx = t.clientX - start.x;
                const dy = t.clientY - start.y;
                if (Math.abs(dx) < 50 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
                const i = TABS.indexOf(activeTab);
                if (dx < 0 && i < TABS.length - 1) setActiveTab(TABS[i + 1]);
                if (dx > 0 && i > 0) setActiveTab(TABS[i - 1]);

                return (

                            <div className="flex items-center justify-between">
                                <label htmlFor="weight" className="text-lg">體重 (kg)</label>
                                <input id="weight" type="number" inputMode="decimal" step="0.1" value={todayHealth.weight} onChange={(e) => updateHealthLog('weight', e.target.value)} onBlur={(e) => { if (parseFloat(e.target.value) > 0) rewardOnce('weight', 1, '體重'); }} className="bg-darkBg w-28 text-right px-4 py-2.5 rounded-lg text-white border border-gray-700 focus:neon-border-theme focus:outline-none transition-colors text-lg" />
                            </div>
                            <div className="flex items-center justify-between">
                                <label htmlFor="bodyFat" className="text-lg">體脂率 (%)</label>
                                <input id="bodyFat" type="number" inputMode="decimal" step="0.1" value={todayHealth.bodyFat} onChange={(e) => updateHealthLog('bodyFat', e.target.value)} onBlur={(e) => { if (parseFloat(e.target.value) > 0) rewardOnce('bodyFat', 1, '體脂'); }} className="bg-darkBg w-28 text-right px-4 py-2.5 rounded-lg text-white border border-gray-700 focus:neon-border-theme focus:outline-none transition-colors text-lg" />
                            </div>
                        </div>
                        <div className="mt-6 pt-5 border-t border-gray-800 flex justify-between items-center">
                            <span className="text-gray-300 text-lg">BMI 指數</span>
                            <span className="text-3xl font-black neon-text-theme">{bmi}</span>
                        </div>
                    </div>
                    <div className="bg-cardBg p-5 rounded-2xl border border-gray-800">
                        <h2 className="text-base font-bold text-gray-200 mb-4"><i className="fas fa-chart-line mr-2 neon-text-theme" aria-hidden="true"></i>體重趨勢 (最近 14 筆)</h2>
                        {weightPoints.length >= 2
                            ? <WeightChart points={weightPoints} />
                            : <p className="text-sm text-gray-400 text-center py-4">記錄至少兩天的體重後，這裡會出現趨勢圖。</p>}
                    </div>
                </div>
            );

            const renderDiet = () => {
                const water = parseInt(todayHealth.water) || 0;
                const currentWeight = parseFloat(todayHealth.weight) || (weightPoints.length > 0 ? weightPoints[weightPoints.length-1].w : 0);
                const WATER_GOAL_ML = currentWeight > 0 ? Math.round(currentWeight * 30) : 2000;
                const displayWater = water < 50 && water > 0 ? water * 250 : water;
                
                return (
                    <div className="animate-fade-in flex flex-col min-h-full pb-10" onClick={handleContentClick}>
                        <div className="bg-cardBg rounded-2xl border border-gray-800 p-5 mb-4 shadow-[0_0_15px_rgba(0,180,255,0.05)]">
                            <div className="flex justify-between items-end mb-2">
                                <h2 className="text-base font-bold text-gray-200"><i className="fas fa-droplet mr-2 text-blue-400 drop-shadow-[0_0_5px_rgba(96,165,250,0.8)]" aria-hidden="true"></i>喝水目標</h2>
                                <div className="text-right">
                                    <span className="text-3xl font-black text-blue-400 drop-shadow-[0_0_5px_rgba(96,165,250,0.5)]">{displayWater}</span>
                                    <span className="text-sm font-normal text-gray-400 ml-1">/ {WATER_GOAL_ML} ml</span>
                                </div>
                            </div>
                            
                            <div className="w-full bg-gray-900 rounded-full h-3 shadow-inset-theme mt-1 mb-4" role="progressbar" aria-valuemin="0" aria-valuemax={WATER_GOAL_ML} aria-valuenow={displayWater}>
                                <div className={`h-3 rounded-full transition-all duration-500 ease-out bg-blue-500 shadow-[0_0_10px_rgba(59,130,246,0.8)]`} style={{ width: `${Math.min((displayWater / WATER_GOAL_ML) * 100, 100)}%` }}></div>
                            </div>
                            
                            <div className="flex justify-between items-center space-x-2">
                                <button type="button" onClick={() => changeWater(250, displayWater, WATER_GOAL_ML)} className="flex-1 bg-darkBg border border-gray-700 hover:border-blue-500 text-gray-300 hover:text-blue-400 py-2 rounded-xl text-sm font-bold transition-all flex flex-col items-center">
                                    <i className="fas fa-mug-hot mb-1"></i> + 250ml
                                </button>
                                <button type="button" onClick={() => changeWater(500, displayWater, WATER_GOAL_ML)} className="flex-1 bg-darkBg border border-gray-700 hover:border-blue-500 text-gray-300 hover:text-blue-400 py-2 rounded-xl text-sm font-bold transition-all flex flex-col items-center">
                                    <i className="fas fa-bottle-water mb-1"></i> + 500ml
                                </button>
                                <button type="button" onClick={() => changeWater(-displayWater, displayWater, WATER_GOAL_ML)} className="w-12 h-[52px] bg-red-500/10 border border-red-500/30 hover:border-red-500 text-red-400 rounded-xl text-sm transition-all flex flex-col items-center justify-center">
                                    <i className="fas fa-rotate-left"></i>
                                </button>
                            </div>
                        </div>

                        <div className="bg-cardBg rounded-2xl border border-gray-800 p-5 mb-4">
                            <div className="flex justify-between items-center mb-3">
                                <h2 className="text-base font-bold text-gray-200"><i className="fas fa-utensils mr-2 neon-text-theme" aria-hidden="true"></i>今日飲食 ({date})</h2>
                                <button type="button" onClick={addDietRow} className="neon-text-theme text-base font-bold border neon-border-theme px-4 py-1.5 rounded-full hover:neon-bg-theme hover:text-white transition-colors">
                                    <i className="fas fa-plus mr-1" aria-hidden="true"></i> 新增
                                </button>
                            </div>

                            <div className="space-y-3">
                                {todayDiet.map(item => {
                                    const qty = item.qty ?? '1';
                                    return (
                                        <div key={item.id} className="bg-darkBg border border-gray-800 rounded-xl p-3">
                                            <div className="flex items-center justify-between mb-2">
                                                <select aria-label="餐別" value={item.meal} onChange={(e) => patchDiet(item.id, { meal: e.target.value })} className="bg-cardBg text-white border border-gray-700 rounded-lg px-3 py-2 text-sm focus:outline-none">
                                                    <option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>飲料</option>
                                                </select>
                                                <button type="button" aria-label="刪除這筆飲食" onClick={() => deleteDietItem(item.id)} className="text-red-400 w-11 h-11 flex items-center justify-center"><i className="fas fa-times text-lg" aria-hidden="true"></i></button>
                                            </div>

                                            <div className="relative">
                                                <input
                                                    type="text"
                                                    aria-label="食物內容"
                                                    placeholder="輸入關鍵字，如: 蛋餅"
                                                    value={item.food}
                                                    onChange={(e) => handleFoodInputChange(item, e.target.value)}
                                                    onClick={(e) => e.stopPropagation()}
                                                    className="bg-cardBg text-white border border-gray-700 rounded-lg px-3 py-2.5 w-full text-sm focus:outline-none focus:neon-border-theme"
                                                />
                                                {activeFoodInputId === item.id && foodSuggestions.length > 0 && (
                                                    <div className="autocomplete-list shadow-theme" role="listbox">
                                                        {foodSuggestions.map((food) => (
                                                            <div
                                                                key={food.name}
                                                                role="option"
                                                                className="autocomplete-item flex justify-between items-center"
                                                                onClick={(e) => { e.stopPropagation(); selectFoodSuggestion(item, food); }}
                                                            >
                                                                <div>{food.name} <span>({food.unit})</span></div>
                                                                <div className="neon-text-theme font-bold">{food.calories}</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                            {item.base ? (
                                                <p className="text-xs text-gray-400 mt-1">每份：{item.unit} · {item.base} kcal</p>
                                            ) : null}

                                            <div className="flex items-center justify-between mt-3 space-x-3">
                                                <label className="flex items-center text-sm text-gray-300">
                                                    份數
                                                    <input type="number" inputMode="decimal" min="0" step="0.5" value={qty} onChange={(e) => handleQtyChange(item, e.target.value)} className="bg-cardBg text-white border border-gray-700 rounded-lg px-2 py-2 w-20 ml-2 text-sm text-right focus:outline-none focus:neon-border-theme" />
                                                </label>
                                                <label className="flex items-center text-sm text-gray-300">
                                                    熱量
                                                    <input type="number" inputMode="numeric" min="0" placeholder="kcal" value={item.calories} onChange={(e) => handleCaloriesChange(item, e.target.value)} className="bg-cardBg text-white border border-gray-700 rounded-lg px-2 py-2 w-24 ml-2 text-sm text-right focus:outline-none focus:neon-border-theme" />
                                                </label>
                                            </div>
                                        </div>
                                    );
                                })}
                                {todayDiet.length === 0 && <div className="text-center text-gray-400 py-8 text-base font-bold">尚未記錄今日飲食</div>}
                            </div>
                        </div>

                        <div className="bg-cardDark border neon-border-theme rounded-2xl p-5 flex flex-col mt-auto shadow-theme">
                            <div className="flex justify-between items-end mb-2">
                                <span className="font-bold text-gray-200 text-lg">今日總熱量</span>
                                <div className="text-right">
                                    <span className="text-3xl font-black neon-text-theme">{Math.round(totalCalories)}</span>
                                    <span className="text-sm font-normal text-gray-300 ml-1">/ {calGoal} kcal</span>
                                </div>
                            </div>
                            <div className="w-full bg-gray-900 rounded-full h-3 shadow-inset-theme mt-1" role="progressbar" aria-valuemin="0" aria-valuemax={calGoal} aria-valuenow={Math.round(totalCalories)} aria-label="今日熱量進度">
                                <div className={`h-3 rounded-full transition-all duration-500 ease-out ${isOver ? 'bg-amber-500 shadow-[0_0_10px_rgba(245,158,11,0.8)]' : 'neon-bg-theme shadow-theme'}`} style={{ width: `${barWidth}%` }}></div>
                            </div>
                            {isOver && <p className="text-amber-300 text-sm text-right mt-2">今天超過目標了，明天再慢慢調整就好。</p>}
                        </div>
                    </div>
                );
            };

            return (
                <div
                    className={`app-shell flex flex-col max-w-md mx-auto relative overflow-hidden bg-darkBg text-white swipe-container ${themeClass}`}
                    onTouchStart={onTouchStart}
                    onTouchEnd={onTouchEnd}
                >
                    <div className="sr-only" role="status" aria-live="polite">{toast}</div>
                    {toast && (
                        <div aria-hidden="true" className="absolute top-20 left-1/2 transform -translate-x-1/2 z-50 neon-bg-theme text-white px-5 py-2 rounded-full font-bold text-base shadow-theme animate-bounce whitespace-nowrap">
                            {toast}
                        </div>
                    )}

                    <div className="p-5 pb-3 shrink-0">
                        <h1 className="text-3xl font-black italic tracking-wider neon-text-light text-center mb-5">Delicate Glow Up</h1>

                        <div className="flex justify-center items-center space-x-3">
                            <button type="button" aria-label="前一天" onClick={() => changeDate(-1)} className="w-11 h-11 rounded-full bg-cardBg border border-gray-700 hover:neon-border-theme flex items-center justify-center text-gray-300 hover:text-white transition-colors">
                                <i className="fas fa-chevron-left" aria-hidden="true"></i>
                            </button>

                            <div className="relative hover:neon-border-theme rounded-full transition-colors">
                                <div className="bg-cardBg border border-gray-700 rounded-full px-6 py-2.5 text-center text-base font-bold w-[165px] flex items-center justify-center neon-text-theme cursor-pointer">
                                    {date} <i className="fas fa-calendar-alt ml-2 opacity-50" aria-hidden="true"></i>
                                </div>
                                <input
                                    type="date" aria-label="選擇日期" value={date}
                                    onChange={(e) => { if (e.target.value) setDate(e.target.value); }}
                                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                />
                            </div>

                            <button type="button" aria-label="後一天" onClick={() => changeDate(1)} className="w-11 h-11 rounded-full bg-cardBg border border-gray-700 hover:neon-border-theme flex items-center justify-center text-gray-300 hover:text-white transition-colors">
                                <i className="fas fa-chevron-right" aria-hidden="true"></i>
                            </button>
                        </div>
                    </div>

                    <div className="flex px-3 mb-4 shrink-0 border-b border-gray-800" role="tablist">
                        {TAB_DEFS.map(t => (
                            <button
                                key={t.id}
                                type="button"
                                role="tab"
                                aria-selected={activeTab === t.id}
                                className={`flex-1 pb-3 text-base font-bold transition-all ${activeTab === t.id ? 'neon-text-theme border-b-2 neon-border-theme' : 'text-gray-400'}`}
                                onClick={() => setActiveTab(t.id)}
                            >
                                <i className={`fas ${t.icon} mr-1`} aria-hidden="true"></i> {t.label}
                            </button>
                        ))}
                    </div>

                    <div className="flex-1 overflow-y-auto px-5 pb-8" role="tabpanel">
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'skincare' && renderSkincare()}
                        {activeTab === 'health' && renderHealth()}
                        {activeTab === 'diet' && renderDiet()}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
