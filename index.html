        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        neonPink: 'var(--theme-color)',
                        darkBg: '#0a0a0a',
                        cardBg: '#1a1a1a',
                        cardDark: '#121212'
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'bounce-slight': 'bounceSlight 2s infinite',
                        'heart-float': 'heartFloat 1s ease-out forwards'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' }
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, filter: 'drop-shadow(0 0 10px var(--theme-color))' },
                            '50%': { opacity: .7, filter: 'drop-shadow(0 0 25px var(--theme-color))' }
                        },
                        bounceSlight: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-5px)' }
                        },
                        heartFloat: {
                            '0%': { opacity: 1, transform: 'translateY(0) scale(1)' },
                            '100%': { opacity: 0, transform: 'translateY(-40px) scale(1.5)' }
                        }
                    }
                }
            }
        }

                const saved = localStorage.getItem('glowUpPetExps');

                const oldExp = parseInt(localStorage.getItem('glowUpPetExp')) || 0;
                const currentPet = localStorage.getItem('glowUpPetType') || 'penguin';
                return { penguin: currentPet === 'penguin' ? oldExp : 0, bird: currentPet === 'bird' ? oldExp : 0, snail: currentPet === 'snail' ? oldExp : 0, sheep: currentPet === 'sheep' ? oldExp : 0, cat: currentPet === 'cat' ? oldExp : 0, dog: currentPet === 'dog' ? oldExp : 0 };
            });

            const handlePrevPet = (e) => { e.stopPropagation(); setPetType(petKeys[(currentPetIndex - 1 + petKeys.length) % petKeys.length]); };

            const currentPetExp = petExps[petType] || 0;
                const currentLevel = Math.floor(currentPetExp / EXP_PER_LEVEL) + 1;
                if (currentLevel >= MAX_LEVEL) {
                    setThemeClass('theme-maxlevel');

                    const hour = new Date().getHours();
                    if (hour >= 6 && hour < 18) {
                        setThemeClass('theme-morning');
                    } else {
                        setThemeClass('theme-night');

            useEffect(() => { localStorage.setItem('glowUpStreak', streak.toString()); }, [streak]);
            useEffect(() => { localStorage.setItem('glowUpPetType', petType); }, [petType]);
            useEffect(() => { localStorage.setItem('glowUpPetExps', JSON.stringify(petExps)); }, [petExps]);
            useEffect(() => { localStorage.setItem('glowUpRoutines', JSON.stringify(routines)); }, [routines]);

            useEffect(() => { localStorage.setItem('glowUpHealthLogs', JSON.stringify(healthLogs)); }, [healthLogs]);

                        const yesterday = new Date();

                            setStreak(prev => prev + 1);
                        } else {
                            setStreak(1);

                    } else {
                        setStreak(1);
                    }
                    setLastActiveDate(todayStr);
                }
            };

            const addExp = (amount, source) => {
                setPetExps(prev => ({ ...prev, [petType]: (prev[petType] || 0) + amount }));
                setExpNotice(`+${amount} EXP (${source})`);
                setTimeout(() => setExpNotice(''), 2000);
                recordActivity();

            const handlePetInteract = () => {
                const currentPetData = PETS[petType] || PETS['penguin'];
                const randomMsg = currentPetData.dialogues[Math.floor(Math.random() * currentPetData.dialogues.length)];
                setInteractionMsg(randomMsg);
                setIsInteracting(true);
                
                const newHeart = { id: Date.now(), x: Math.random() * 40 - 20 };
                setHearts(prev => [...prev, newHeart]);
                setTimeout(() => { setHearts(prev => prev.filter(h => h.id !== newHeart.id)); }, 1000);

                if (interactionTimerRef.current) clearTimeout(interactionTimerRef.current);
                interactionTimerRef.current = setTimeout(() => {
                    setInteractionMsg('');
                    setIsInteracting(false);
                }, 2500);
            };
            
            const changeDate = (days) => {
                const d = new Date(date);
                d.setDate(d.getDate() + days);
                setDate(d.toISOString().split('T')[0]);
            };

            const moveItem = (index, direction) => {
                if (direction === -1 && index === 0) return;
                if (direction === 1 && index === routines[time].length - 1) return;
                
                const newRoutine = [...routines[time]];
                const temp = newRoutine[index];
                newRoutine[index] = newRoutine[index + direction];
                newRoutine[index + direction] = temp;
                
                setRoutines(prev => ({ ...prev, [time]: newRoutine }));
            };

            const addItem = (iconItem) => {
                const newItem = { id: Date.now().toString(), icon: iconItem.icon, name: iconItem.name, brand: '' };
                setRoutines(prev => ({ ...prev, [time]: [...prev[time], newItem] }));
            };
            const updateBrand = (id, val) => {
                setRoutines(prev => ({ ...prev, [time]: prev[time].map(item => item.id === id ? { ...item, brand: val } : item) }));
            };
            const deleteItem = (id) => {
                setRoutines(prev => ({ ...prev, [time]: prev[time].filter(item => item.id !== id) }));
            };
            const toggleLog = (itemId) => {
                setLogs(prev => {
                    const dayLogs = prev[date] || { morning: [], evening: [] };
                    const timeLogs = dayLogs[time] || [];
                    const isCompleted = timeLogs.includes(itemId);
                    const newTimeLogs = isCompleted ? timeLogs.filter(id => id !== itemId) : [...timeLogs, itemId];
                    if (!isCompleted) addExp(2, '保養');
                    return { ...prev, [date]: { ...dayLogs, [time]: newTimeLogs } };
                });
            };
            
            const updateHealthLog = (field, value) => {
                setHealthLogs(prev => ({ ...prev, [date]: { ...(prev[date] || { weight: '', bodyFat: '' }), [field]: value } }));
            };

            const todayDiet = dietLogs[date] || [];
            const addDietRow = () => {
                const newItem = { id: Date.now().toString(), meal: '午餐', food: '', calories: '' };
                setDietLogs(prev => ({ ...prev, [date]: [...(prev[date] || []), newItem] }));
                addExp(3, '飲食');
            };
            
            const handleFoodInputChange = (id, value) => {
                setDietLogs(prev => ({ ...prev, [date]: (prev[date] || []).map(item => item.id === id ? { ...item, food: value } : item) }));
                if (value.trim() !== '') {
                    const matches = FOOD_DB.filter(food => food.name.includes(value)).slice(0, 8);
                    setFoodSuggestions(matches);
                    setActiveFoodInputId(id);
                } else {
                    setFoodSuggestions([]);
                    setActiveFoodInputId(null);
                }
            };

            const selectFoodSuggestion = (id, foodItem) => {
                setDietLogs(prev => ({
                    ...prev,
                    [date]: (prev[date] || []).map(item => item.id === id ? { ...item, food: foodItem.name, calories: foodItem.calories.toString() } : item)
                }));
                setFoodSuggestions([]);
                setActiveFoodInputId(null);
            };
            
            const updateDietItem = (id, field, value) => {
                setDietLogs(prev => ({ ...prev, [date]: (prev[date] || []).map(item => item.id === id ? { ...item, [field]: value } : item) }));
            };
            const deleteDietItem = (id) => {
                setDietLogs(prev => ({ ...prev, [date]: (prev[date] || []).filter(item => item.id !== id) }));
            };
            const totalCalories = todayDiet.reduce((sum, item) => sum + (parseFloat(item.calories) || 0), 0);
            const calGoal = parseFloat(healthProfile.calorieGoal) || 1500;
            const calProgress = Math.min((totalCalories / calGoal) * 100, 100);
            
            const exportData = () => {
                const data = {
                    lastActiveDate, streak, petType, petExps, routines, logs, healthProfile, healthLogs, dietLogs
                };
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(data));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", `GlowUp_Backup_${todayStr}.json`);
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
                alert("備份已下載！請妥善保存檔案。");
            };

            const importData = (event) => {
                const fileReader = new FileReader();
                fileReader.readAsText(event.target.files[0], "UTF-8");
                fileReader.onload = e => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if(data.streak !== undefined && data.petType !== undefined) {
                            if(data.lastActiveDate) setLastActiveDate(data.lastActiveDate);
                            if(data.streak !== undefined) setStreak(data.streak);
                            if(data.petType) setPetType(data.petType);
                            if(data.petExps) setPetExps(data.petExps);
                            if(data.routines) setRoutines(data.routines);
                            if(data.logs) setLogs(data.logs);
                            if(data.healthProfile) setHealthProfile(data.healthProfile);
                            if(data.healthLogs) setHealthLogs(data.healthLogs);
                            if(data.dietLogs) setDietLogs(data.dietLogs);
                            alert("資料還原成功！");
                        } else {

                const isLeftSwipe = distance > minSwipeDistance;
                const isRightSwipe = distance < -minSwipeDistance;
                
                const currentIndex = TABS.indexOf(activeTab);
                
                if (isLeftSwipe && currentIndex < TABS.length - 1) {
                    setActiveTab(TABS[currentIndex + 1]);
                }
                if (isRightSwipe && currentIndex > 0) {
                    setActiveTab(TABS[currentIndex - 1]);

                                {interactionMsg || getPetMood()}

                            ))}

                                <span className={`${getPetSize()} select-none`}>{petEmoji}</span>
                            </div>
                        </div>
                        
                        <div className="w-full z-10 mt-2">

                                <span className="font-black text-2xl text-white">
                                    Lv. {displayLevel}

                                    {isMaxLevel && <span className="ml-2 text-sm bg-darkBg neon-border-theme px-2 py-0.5 rounded-full text-white">MAX 👑</span>}

                                點擊摸摸牠吧！每次記錄，寵物也會長大喔！
                            </p>
                        </div>
                    </div>

                    <div className="w-full mt-4 bg-cardBg rounded-2xl p-4 border border-gray-800 flex flex-col items-center">

                        <div className="flex items-center justify-between w-full px-4">

                                <i className="fas fa-chevron-left"></i>
                            </button>
                            
                            <div className="flex flex-col items-center justify-center bg-black/40 border neon-border-theme shadow-theme rounded-xl p-4 w-32 relative">
                                {(() => {
                                    const thisExp = petExps[petType] || 0;
                                    const thisLv = Math.floor(thisExp / EXP_PER_LEVEL) + 1;
                                    const thisStage = thisLv >= MAX_LEVEL ? 3 : (thisLv === 1 ? 0 : (thisLv === 2 ? 1 : 2));
                                    const pet = PETS[petType];
                                    return (
                                        <>
                                            <span className="text-4xl mb-2">{pet.stages[thisStage]}</span>
                                            <span className="text-base font-bold text-white">{pet.name}</span>
                                            <span className="absolute top-2 right-2 text-xs font-bold text-gray-400">Lv.{thisLv >= MAX_LEVEL ? 'MAX' : thisLv}</span>
                                        </>
                                    );
                                })()}
                            </div>
                            
                            <button onClick={handleNextPet} className="w-10 h-10 rounded-full bg-darkBg border border-gray-700 hover:neon-border-theme flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                                <i className="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <div className="w-full mt-4 bg-darkBg border border-gray-800 rounded-2xl p-4 flex justify-between items-center">
                        <div className="text-sm text-gray-400"><i className="fas fa-database mr-2"></i>資料備份與還原</div>
                        <div className="flex space-x-2">
                            <button onClick={exportData} className="bg-gray-800 text-gray-200 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-gray-700 transition">匯出</button>
                            <label className="bg-gray-800 text-gray-200 px-3 py-1.5 rounded-lg text-sm font-bold hover:bg-gray-700 transition cursor-pointer">
                                匯入
                                <input type="file" accept=".json" onChange={importData} className="hidden" />
                            </label>
                        </div>
                    </div>
                </div>
            );

            const renderSkincare = () => {
                const currentRoutine = routines[time] || [];
                const currentLogs = (logs[date] && logs[date][time]) ? logs[date][time] : [];
                return (
                    <div className="flex flex-col min-h-full pb-10" onClick={handleContentClick}>
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex bg-cardBg rounded-full p-1 flex-1 mr-4">
                                <button className={`flex-1 py-2.5 rounded-full font-bold text-base neon-btn ${time === 'morning' ? 'neon-bg-theme' : 'text-gray-400'}`} onClick={() => setTime('morning')}>早晨</button>
                                <button className={`flex-1 py-2.5 rounded-full font-bold text-base neon-btn ${time === 'evening' ? 'neon-bg-theme' : 'text-gray-400'}`} onClick={() => setTime('evening')}>夜間</button>
                            </div>
                            <button onClick={() => setIsEdit(!isEdit)} className="neon-text-theme p-2 w-12 text-center bg-cardBg rounded-full border border-gray-800">
                                {isEdit ? <i className="fas fa-check text-xl"></i> : <i className="fas fa-pen text-xl"></i>}
                            </button>
                        </div>
                        {isEdit && (
                            <div className="mb-6 bg-cardDark p-4 rounded-xl border border-gray-800 shadow-theme">
                                <p className="text-sm text-gray-400 mb-3 text-center font-bold">點選下方圖示加入保養程序</p>
                                <div className="grid grid-cols-3 gap-2">
                                    {ICONS.map(i => (
                                        <button key={i.id} onClick={() => addItem(i)} className="flex flex-col items-center p-3 rounded-lg bg-cardBg border border-gray-800 hover:neon-border-theme active:neon-bg-theme transition-colors">
                                            <span className="text-2xl mb-1">{i.icon}</span><span className="text-sm font-bold text-gray-300">{i.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}
                        <div className="flex-1 overflow-y-auto pb-10 space-y-3">
                            {currentRoutine.length === 0 ? (
                                <div className="text-center text-gray-500 mt-10 text-base font-bold">{isEdit ? "請選擇上方保養品加入清單" : "目前沒有設定，請點擊右上角編輯"}</div>
                            ) : (
                                currentRoutine.map((item, index) => {
                                    const isCompleted = currentLogs.includes(item.id);
                                    return (
                                        <div key={item.id} className={`flex items-center p-4 rounded-xl transition-all ${isCompleted && !isEdit ? 'bg-black/30 border border-gray-600' : 'bg-cardBg border border-gray-800'}`}>
                                            {isEdit && (
                                                <div className="flex flex-col mr-2">
                                                    <button onClick={() => moveItem(index, -1)} className={`p-1 ${index === 0 ? 'text-gray-700' : 'text-gray-400 hover:text-white'}`}><i className="fas fa-chevron-up"></i></button>
                                                    <button onClick={() => moveItem(index, 1)} className={`p-1 ${index === currentRoutine.length-1 ? 'text-gray-700' : 'text-gray-400 hover:text-white'}`}><i className="fas fa-chevron-down"></i></button>
                                                </div>
                                            )}
                                            <div className="text-3xl mr-4">{item.icon}</div>
                                            <div className="flex-1">
                                                <div className="font-bold text-lg">{item.name}</div>
                                                {isEdit ? (
                                                    <input type="text" placeholder="輸入品牌..." value={item.brand} onChange={(e) => updateBrand(item.id, e.target.value)} className="bg-darkBg text-sm px-3 py-2 rounded-lg mt-2 w-full text-white focus:outline-none focus:neon-border-theme border border-gray-700" />
                                                ) : (
                                                    <div className="text-sm text-gray-400 mt-1">{item.brand || '未設定品牌'}</div>
                                                )}
                                            </div>
                                            {isEdit ? (
                                                <button onClick={() => deleteItem(item.id)} className="ml-4 text-red-400 p-3 rounded-full bg-red-500/10"><i className="fas fa-trash text-base"></i></button>
                                            ) : (
                                                <button onClick={() => toggleLog(item.id)} className={`ml-4 w-10 h-10 rounded-full flex items-center justify-center border-2 transition-all ${isCompleted ? 'neon-bg-theme neon-border-theme text-white shadow-theme' : 'border-gray-600 text-transparent'}`}><i className="fas fa-check text-lg"></i></button>
                                            )}
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    </div>
                );
            };

            const renderHealth = () => (
                <div className="animate-fade-in space-y-6" onClick={handleContentClick}>
                    <div className="bg-cardBg p-5 rounded-2xl border border-gray-800">
                        <h2 className="text-base font-bold text-gray-300 mb-5"><i className="fas fa-user mr-2 neon-text-theme"></i>基本資料 (共用)</h2>
                        <div className="space-y-5">
                            <div className="flex items-center justify-between">
                                <span className="text-lg">性別</span>
                                <div className="flex bg-darkBg border border-gray-700 rounded-lg p-1">
                                    <button 
                                        onClick={() => handleGenderChange('male')}
                                        className={`px-4 py-1.5 rounded-md text-sm font-bold transition-colors ${healthProfile.gender === 'male' ? 'bg-blue-600 text-white shadow-[0_0_10px_rgba(37,99,235,0.8)]' : 'text-gray-500 hover:text-gray-300'}`}
                                    >男生</button>
                                    <button 
                                        onClick={() => handleGenderChange('female')}
                                        className={`px-4 py-1.5 rounded-md text-sm font-bold transition-colors ${healthProfile.gender === 'female' ? 'neon-bg-theme text-white shadow-theme' : 'text-gray-500 hover:text-gray-300'}`}
                                    >女生</button>
                                </div>
                            </div>
                            <div className="flex items-center justify-between">
                                <span className="text-lg">身高 (cm)</span>
                                <input type="number" placeholder="例如: 160" value={healthProfile.height} onChange={(e) => setHealthProfile({...healthProfile, height: e.target.value})} className="bg-darkBg w-28 text-right px-4 py-2.5 rounded-lg text-white border border-gray-700 focus:neon-border-theme focus:outline-none transition-colors text-lg" />
                            </div>
                            <div className="flex items-center justify-between">
                                <span className="text-lg">每日熱量目標 (kcal)</span>
                                <input type="number" placeholder="例如: 1500" value={healthProfile.calorieGoal} onChange={(e) => setHealthProfile({...healthProfile, calorieGoal: e.target.value})} className="bg-darkBg w-28 text-right px-4 py-2.5 rounded-lg text-white border border-gray-700 focus:neon-border-theme focus:outline-none transition-colors text-lg" />
                            </div>
                        </div>
                    </div>
                    <div className="bg-cardBg p-5 rounded-2xl border neon-border-theme shadow-theme">
                        <h2 className="text-base font-bold text-gray-300 mb-5"><i className="fas fa-weight-scale mr-2 neon-text-theme"></i>今日數值 ({date})</h2>
                        <div className="space-y-5">
                            <div className="flex items-center justify-between">
                                <span className="text-lg">體重 (kg)</span>
                                <input type="number" value={todayHealth.weight} onChange={(e) => updateHealthLog('weight', e.target.value)} onBlur={(e) => { if(e.target.value) addExp(1, '體重'); }} className="bg-darkBg w-28 text-right px-4 py-2.5 rounded-lg text-white border border-gray-700 focus:neon-border-theme focus:outline-none transition-colors text-lg" />
                            </div>
                            <div className="flex items-center justify-between">
                                <span className="text-lg">體脂率 (%)</span>
                                <input type="number" value={todayHealth.bodyFat} onChange={(e) => updateHealthLog('bodyFat', e.target.value)} onBlur={(e) => { if(e.target.value) addExp(1, '體脂'); }} className="bg-darkBg w-28 text-right px-4 py-2.5 rounded-lg text-white border border-gray-700 focus:neon-border-theme focus:outline-none transition-colors text-lg" />
                            </div>
                        </div>
                        <div className="mt-6 pt-5 border-t border-gray-800 flex justify-between items-center">
                            <span className="text-gray-400 text-lg">BMI 指數</span>
                            <span className="text-3xl font-black neon-text-theme">{bmi}</span>
                        </div>
                    </div>
                </div>
            );

            const renderDiet = () => (
                <div className="animate-fade-in flex flex-col h-full" onClick={handleContentClick}>
                    <div className="bg-cardBg rounded-2xl border border-gray-800 p-5 mb-4">
                        <div className="flex justify-between items-center mb-3">
                            <h2 className="text-base font-bold text-gray-300"><i className="fas fa-utensils mr-2 neon-text-theme"></i>今日飲食 ({date})</h2>
                            <button onClick={addDietRow} className="neon-text-theme text-base font-bold border neon-border-theme px-4 py-1.5 rounded-full hover:neon-bg-theme hover:text-white transition-colors">
                                <i className="fas fa-plus mr-1"></i> 新增
                            </button>
                        </div>
                        <div className="overflow-visible">
                            <table className="overflow-visible">
                                <thead><tr><th className="w-[25%]">餐別</th><th className="w-[45%]">食物內容 (關鍵字)</th><th className="w-[20%] text-right">熱量</th><th className="w-[10%] text-center"></th></tr></thead>
                                <tbody>
                                    {todayDiet.map(item => (
                                        <tr key={item.id}>
                                            <td><select value={item.meal} onChange={(e) => updateDietItem(item.id, 'meal', e.target.value)} className="bg-darkBg text-white border border-gray-700 rounded-lg px-2 py-2.5 w-full text-sm focus:outline-none focus:neon-border-theme"><option>早餐</option><option>午餐</option><option>晚餐</option><option>點心</option><option>飲料</option></select></td>
                                            <td className="relative">
                                                <input 
                                                    type="text" 
                                                    placeholder="如: 蛋餅" 
                                                    value={item.food} 
                                                    onChange={(e) => handleFoodInputChange(item.id, e.target.value)} 
                                                    onClick={(e) => e.stopPropagation()}
                                                    className="bg-darkBg text-white border border-gray-700 rounded-lg px-3 py-2.5 w-full text-sm focus:outline-none focus:neon-border-theme" 
                                                />
                                                {activeFoodInputId === item.id && foodSuggestions.length > 0 && (
                                                    <div className="autocomplete-list shadow-theme">
                                                        {foodSuggestions.map((food, idx) => (
                                                            <div 
                                                                key={idx} 
                                                                className="autocomplete-item flex justify-between items-center"
                                                                onClick={(e) => { e.stopPropagation(); selectFoodSuggestion(item.id, food); }}
                                                            >
                                                                <div>{food.name} <span className="text-xs">({food.unit})</span></div>
                                                                <div className="neon-text-theme font-bold">{food.calories}</div>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </td>
                                            <td><input type="number" placeholder="kcal" value={item.calories} onChange={(e) => updateDietItem(item.id, 'calories', e.target.value)} className="bg-darkBg text-white border border-gray-700 rounded-lg px-2 py-2.5 w-full text-sm text-right focus:outline-none focus:neon-border-theme" /></td>
                                            <td className="text-center"><button onClick={() => deleteDietItem(item.id)} className="text-red-400/70 hover:text-red-400 p-2"><i className="fas fa-times text-lg"></i></button></td>
                                        </tr>
                                    ))}
                                    {todayDiet.length === 0 && <tr><td colSpan="4" className="text-center text-gray-500 py-8 text-base font-bold">尚未記錄今日飲食</td></tr>}
                                </tbody>
                            </table>
                        </div>
                    </div>
                    
                    <div className="bg-cardDark border neon-border-theme rounded-2xl p-5 flex flex-col mt-auto shadow-theme">
                        <div className="flex justify-between items-end mb-2">
                            <span className="font-bold text-gray-300 text-lg">今日總熱量</span>
                            <div className="text-right">
                                <span className="text-3xl font-black neon-text-theme">{totalCalories}</span>
                                <span className="text-sm font-normal text-gray-400 ml-1">/ {calGoal} kcal</span>
                            </div>
                        </div>
                        <div className="w-full bg-gray-900 rounded-full h-3 shadow-inset-theme mt-1">
                            <div className={`h-3 rounded-full transition-all duration-500 ease-out shadow-theme ${calProgress > 100 ? 'bg-red-500 shadow-[0_0_10px_red]' : 'neon-bg-theme'}`} style={{ width: `${Math.min(calProgress, 100)}%` }}></div>
                        </div>
                        {calProgress > 100 && <p className="text-red-400 text-xs text-right mt-2">已超過目標熱量！</p>}
                    </div>
                </div>
            );

            return (
                <div 
                    className={`h-screen flex flex-col max-w-md mx-auto relative overflow-hidden bg-darkBg text-white swipe-container ${themeClass}`}
                    onTouchStart={onTouchStart}
                    onTouchMove={onTouchMove}
                    onTouchEnd={onTouchEnd}
                >
                    {expNotice && (
                        <div className="absolute top-20 left-1/2 transform -translate-x-1/2 z-50 neon-bg-theme text-white px-5 py-2 rounded-full font-bold text-base shadow-theme animate-bounce">
                            {expNotice}
                        </div>
                    )}

                    <div className="p-5 pb-3 shrink-0">
                        <h1 className="text-3xl font-black italic tracking-wider neon-text-light text-center mb-5">Delicate Glow Up</h1>
                        
                        <div className="flex justify-center items-center space-x-3">
                            <button onClick={() => changeDate(-1)} className="w-10 h-10 rounded-full bg-cardBg border border-gray-700 hover:neon-border-theme flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                                <i className="fas fa-chevron-left"></i>
                            </button>
                            
                            <div className="relative">
                                <div className="bg-cardBg border border-gray-700 rounded-full px-6 py-2.5 text-center text-base font-bold w-[160px] flex items-center justify-center neon-text-theme">
                                    {date}
                                </div>
                                <input 
                                    type="date" value={date} onChange={(e) => setDate(e.target.value)}
                                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer"
                                />
                            </div>
                            
                            <button onClick={() => changeDate(1)} className="w-10 h-10 rounded-full bg-cardBg border border-gray-700 hover:neon-border-theme flex items-center justify-center text-gray-400 hover:text-white transition-colors">
                                <i className="fas fa-chevron-right"></i>
                            </button>
                        </div>
                    </div>

                    <div className="flex px-3 mb-4 shrink-0 border-b border-gray-800">
                        <button className={`flex-1 pb-3 text-base font-bold transition-all ${activeTab === 'home' ? 'neon-text-theme border-b-2 neon-border-theme' : 'text-gray-500'}`} onClick={() => setActiveTab('home')}><i className="fas fa-home mr-1"></i> 寵物</button>
                        <button className={`flex-1 pb-3 text-base font-bold transition-all ${activeTab === 'skincare' ? 'neon-text-theme border-b-2 neon-border-theme' : 'text-gray-500'}`} onClick={() => setActiveTab('skincare')}><i className="fas fa-sparkles mr-1"></i> 保養</button>
                        <button className={`flex-1 pb-3 text-base font-bold transition-all ${activeTab === 'health' ? 'neon-text-theme border-b-2 neon-border-theme' : 'text-gray-500'}`} onClick={() => setActiveTab('health')}><i className="fas fa-heart-pulse mr-1"></i> 健康</button>
                        <button className={`flex-1 pb-3 text-base font-bold transition-all ${activeTab === 'diet' ? 'neon-text-theme border-b-2 neon-border-theme' : 'text-gray-500'}`} onClick={() => setActiveTab('diet')}><i className="fas fa-salad mr-1"></i> 飲食</button>
                    </div>

                    <div className="flex-1 overflow-y-auto px-5 pb-8">
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'skincare' && renderSkincare()}
                        {activeTab === 'health' && renderHealth()}
                        {activeTab === 'diet' && renderDiet()}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
