<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const toLocalDateStr = (d = new Date()) => {
            const y = d.getFullYear(); const m = String(d.getMonth() + 1).padStart(2, '0'); const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        };
        const parseLocalDate = (s) => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
        const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const isObj = (v) => v !== null && typeof v === 'object' && !Array.isArray(v);

        const load = (key, fallback) => { try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; } catch { return fallback; } };
        const loadRaw = (key, fallback) => { try { const raw = localStorage.getItem(key); return raw === null ? fallback : raw; } catch { return fallback; } };
        const usePersist = (key, value, raw = false) => { useEffect(() => { try { localStorage.setItem(key, raw ? String(value) : JSON.stringify(value)); } catch {} }, [key, value, raw]); };
        const normalizeRoutines = (r) => ({ morning: Array.isArray(r?.morning) ? r.morning : [], evening: Array.isArray(r?.evening) ? r.evening : [] });

        const QUOTES = [

            "把時間花在自己身上，是最穩賺不賠的投資。", "卸下疲憊，今晚只做最真實的自己。", "慢慢來，每一步都算數。"
        ];

        /* Simplified Icons */

            { id: 'custom1', icon: '📝', name: '其他自訂' }

        /* Pets - Using image references for the final stage */
        const PETS = {

                dialogues: ["咕嚕～看見你來，我心裡就暖洋洋的！❤️", "今天有好好喝水嗎？咕嚕！", "陪我一起發呆一下下吧～", "你今天超級棒的喔！拍手！"],
                interactions: { feed: { emoji: '🐟', dialogue: "啊姆啊姆... 謝謝你！吃飽飽好幸福～" }, play: { emoji: '🪁', dialogue: "耶！一起玩！轉圈圈～～" }, clean: { emoji: '✨', dialogue: "洗得乾乾淨淨，羽毛好蓬鬆喔！" }, talk: { emoji: '💬', dialogue: "偷偷跟你說，我最喜歡待在你旁邊了。" }, rest: { emoji: '☕', dialogue: "喝杯熱茶，蓋上小被被... 晚安囉 💤" } }
            },

                dialogues: ["啾啾！今天也是充滿希望的一天！", "要聽我唱歌嗎？為你唱一首暖暖的歌♪", "蹭蹭你～ 你的氣味好舒服！", "不管去哪裡，我都會為你加油喔！"],
                interactions: { feed: { emoji: '🌾', dialogue: "（開心啄食） 哇！是我最喜歡的果子！" }, play: { emoji: '🪁', dialogue: "在你身邊飛來飛去，啾啾啾！好開心！" }, clean: { emoji: '💧', dialogue: "在水盆裡拍拍翅膀！洗澡好舒服！" }, talk: { emoji: '💬', dialogue: "啾！只要你開心，我就開心！" }, rest: { emoji: '🍃', dialogue: "把頭埋進翅膀裡... 窩在小巢睡著了 💤" } }

                name: '小蝸牛', personality: '佛系勵志 🌱', stages: ['🥚', '🌱', '🐌', 'snail.jpg'], titles: ['草叢小蛋', '背殼小幼苗', '漫步者', '宇宙慢遊'],
                dialogues: ["慢慢來，比較快。每一步都有意義 🐌", "今天我也努力爬了 5 公分喔！", "你的每一點進步，我都看在眼裡 🌈"],
                interactions: { feed: { emoji: '🌱', dialogue: "（細嚼慢嚥） 好新鮮的葉子 🌱 謝謝你！" }, play: { emoji: '🌈', dialogue: "跟你一起慢慢散步，看彩虹好開心。" }, clean: { emoji: '✨', dialogue: "幫我把小殼擦亮了！閃閃發光 🐌" }, talk: { emoji: '💬', dialogue: "我們不用跟別人比快，只要每天前進一點點就好。" }, rest: { emoji: '🌀', dialogue: "安靜地縮回殼裡，在夢裡慢慢旅行 💤" } }
            },
            cat: { 
                name: '橘貓', personality: '愛吃撒嬌 🐾', stages: ['🥚', '🐱', '🐈', 'cat.jpg'], titles: ['暖暖毛線球', '奶音小橘', '貪吃橘胖胖', '暖爐守護神'],
                dialogues: ["喵～ 終於忙完了嗎？來摸摸我吧！", "呼嚕呼嚕... 你的手好溫暖喔。", "不管今天過得怎樣，都有我陪你！"],
                interactions: { feed: { emoji: '🐟', dialogue: "「嚼嚼嚼！」 罐罐最好吃了！喵嗚～" }, play: { emoji: '🧶', dialogue: "（撲騰） 看我的無影手！抓到逗貓棒了！" }, clean: { emoji: '👅', dialogue: "幫我梳毛好舒服... 呼嚕呼嚕..." }, talk: { emoji: '💬', dialogue: "喵。雖然我不常說，但我真的很喜歡你喔。" }, rest: { emoji: '💤', dialogue: "在最溫暖的角落蜷縮起來 💤 夢裡有你。" } }
            },
            dog: { 
                name: '柴犬', personality: '熱情忠誠 ☀️', stages: ['🥚', '🐶', '🐕', 'dog.jpg'], titles: ['肉球小丸子', '好奇小柴', '快樂小幫手', '太陽守護者'],
                dialogues: ["汪汪！你終於回來了！超想你的！🐕", "最喜歡你了！🥰 轉圈圈、搖尾巴！", "今天辛苦啦！快讓我舔舔你的手！🐾"],
                interactions: { feed: { emoji: '🍖', dialogue: "「嗷嗚！」 最愛的肉肉 🍖 吃得超開心！" }, play: { emoji: '🥎', dialogue: "「球球！接飛盤！」 汪汪汪，再來一次！" }, clean: { emoji: '🛁', dialogue: "洗澎澎囉！甩水攻擊！💦 變香香了！" }, talk: { emoji: '💬', dialogue: "汪汪！不管發生什麼事，我都會永遠陪著你！" }, rest: { emoji: '💤', dialogue: "趴在你的腳邊... 呼呼 💤 晚安汪！" } }
            }
        };

        const QUICK_FOODS = [
            { id: 'q1', name: '白飯/麵/主食', calories: 300, icon: '🍚' },
            { id: 'q2', name: '燙青菜/沙拉', calories: 100, icon: '🥗' },
            { id: 'q3', name: '肉類/魚/蛋', calories: 250, icon: '🥩' },
            { id: 'q4', name: '湯品(清湯)', calories: 80, icon: '🍲' },
            { id: 'q5', name: '水果一份', calories: 60, icon: '🍎' },
            { id: 'q6', name: '點心/餅乾', calories: 200, icon: '🍪' }
        ];

        const FOOD_DB = [
            ['白飯', 280, '一碗'], ['糙米飯', 250, '一碗'], ['滷肉飯', 450, '一碗'], ['雞腿飯', 800, '一個'],
            ['炒飯', 700, '一盤'], ['牛肉麵', 650, '一碗'], ['水餃', 60, '一顆'], ['鍋貼', 75, '一顆'],
            ['蔥油餅', 400, '一份'], ['炸雞排', 650, '一塊'], ['燙青菜', 50, '一盤'], ['茶葉蛋', 75, '一顆'],
            ['蛋餅', 300, '一份'], ['三明治', 350, '一份'], ['漢堡', 450, '一個'], ['水煮蛋', 75, '一顆'],
            ['燕麥片', 130, '一碗'], ['地瓜(烤/蒸)', 140, '一條(中)'], ['鮭魚生魚片', 200, '一份(5片)'], 
            ['日式咖哩飯', 750, '一份'], ['豚骨拉麵', 800, '一碗'], ['味噌湯', 50, '一碗'], ['海鮮煎餅', 650, '一份'],
            ['肉醬義大利麵', 650, '一盤'], ['炸薯條', 350, '一份(中)'], ['小火鍋', 600, '一鍋'], ['水', 0, '一杯'],
            ['美式咖啡', 15, '一杯(中)'], ['拿鐵(無糖)', 180, '一杯(中)'], ['無糖綠茶', 0, '一杯(手搖)'], 
            ['珍珠奶茶(全糖)', 650, '一杯(手搖)'], ['無糖豆漿', 120, '一杯'], ['全脂牛奶', 150, '一杯(240ml)'],
            ['蘋果', 95, '一顆(中)'], ['香蕉', 105, '一根(中)'], ['芭樂', 150, '一顆']
        ].map(([name, calories, unit]) => ({ name, calories, unit }));

        const LEVEL_STEPS = [0, 50, 150, 320];
        const getLevelInfo = (exp) => {
            let level = 1;
            for (let i = 1; i < LEVEL_STEPS.length; i++) if (exp >= LEVEL_STEPS[i]) level = i + 1;
            const isMax = level >= LEVEL_STEPS.length;
            const base = LEVEL_STEPS[level - 1];
            const need = isMax ? 0 : LEVEL_STEPS[level] - base;
            const into = exp - base;
            return { level, isMax, into, need, progress: isMax ? 100 : Math.min(100, (into / need) * 100), stageIndex: Math.min(level - 1, 3) };
        };
        
        const TAB_DEFS = [
            { id: 'home', label: '寵物', icon: 'fa-paw' }, { id: 'skincare', label: '日常', icon: 'fa-clipboard-check' },
            { id: 'health', label: '健康', icon: 'fa-heart-pulse' }, { id: 'diet', label: '飲食', icon: 'fa-utensils' }
        ];
        const TABS = TAB_DEFS.map(t => t.id);
        const ZERO_EXPS = Object.fromEntries(Object.keys(PETS).map(k => [k, 0]));
        const DEFAULT_PROFILE = { gender: 'female', height: '', calorieGoal: '1500' };

        const defaultMeal = () => {
            const h = new Date().getHours();
            if (h < 10) return '早餐'; if (h < 15) return '午餐'; if (h < 17) return '點心';
            if (h < 21) return '晚餐'; return '點心';
        };

        const WeightChart = ({ points }) => {
            const W = 320, H = 140, P = 20;
            const ws = points.map(p => p.w); const min = Math.min(...ws), max = Math.max(...ws); const span = max - min || 1;
            const x = (i) => P + (points.length === 1 ? 0 : (i * (W - 2 * P)) / (points.length - 1));
            const y = (w) => H - P - ((w - min) / span) * (H - 2 * P);
            const path = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.w).toFixed(1)}`).join(' ');
            const first = points[0], last = points[points.length - 1];
            return (
                <div>
                    <svg viewBox={`0 0 ${W} ${H}`} className="w-full" role="img" aria-label={`體重趨勢圖，從 ${first.w} 到 ${last.w} 公斤`}>
                        <path d={path} fill="none" stroke="#E07A5F" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                        {points.map((p, i) => ( <circle key={p.date} cx={x(i)} cy={y(p.w)} r="6" fill="#E07A5F" stroke="#FFF" strokeWidth="2" /> ))}
                    </svg>
                    <div className="flex justify-between text-sm text-textMuted mt-3 font-bold">
                        <span>{first.date.slice(5)}</span> <span>最低 {min} / 最高 {max} kg</span> <span>{last.date.slice(5)}</span>
                    </div>

        const App = () => {
            const todayStr = toLocalDateStr();
            const [date, setDate] = useState(todayStr);
            const [activeTab, setActiveTab] = useState('home');
            
            const [quote, setQuote] = useState('');
            const [toast, setToast] = useState('');
            const toastTimerRef = useRef(null);

            const [lastActiveDate, setLastActiveDate] = useState(() => loadRaw('glowUpLastActive', ''));
            const [streak, setStreak] = useState(() => parseInt(loadRaw('glowUpStreak', '0')) || 0);
            const [lastBackup, setLastBackup] = useState(() => loadRaw('glowUpLastBackup', ''));

            const [petType, setPetType] = useState(() => { const t = loadRaw('glowUpPetType', 'penguin'); return PETS[t] ? t : 'penguin'; });
            const [petExps, setPetExps] = useState(() => {
                const saved = load('glowUpPetExps', null);
                if (isObj(saved)) return { ...ZERO_EXPS, ...saved };
                const oldExp = parseInt(loadRaw('glowUpPetExp', '0')) || 0;
                const cur = loadRaw('glowUpPetType', 'penguin');
                return { ...ZERO_EXPS, ...(PETS[cur] ? { [cur]: oldExp } : {}) };
            });

            const [interactionMsg, setInteractionMsg] = useState('');
            const [isInteracting, setIsInteracting] = useState(false);
            const [hearts, setHearts] = useState([]);
            const interactionTimerRef = useRef(null);

            const [time, setTime] = useState('morning');
            const [isEdit, setIsEdit] = useState(false);
            const [routines, setRoutines] = useState(() => normalizeRoutines(load('glowUpRoutines', null)));
            const [logs, setLogs] = useState(() => { const v = load('glowUpLogs', {}); return isObj(v) ? v : {}; });
            const [healthProfile, setHealthProfile] = useState(() => { const v = load('glowUpHealthProfile', {}); return { ...DEFAULT_PROFILE, ...(isObj(v) ? v : {}) }; });
            const [healthLogs, setHealthLogs] = useState(() => { const v = load('glowUpHealthLogs', {}); return isObj(v) ? v : {}; });
            const [dietLogs, setDietLogs] = useState(() => { const v = load('glowUpDietLogs', {}); return isObj(v) ? v : {}; });
            const [rewards, setRewards] = useState(() => { const v = load('glowUpRewards', {}); return isObj(v) ? v : {}; });
            const rewardsRef = useRef(rewards);
            const [activeFoodInputId, setActiveFoodInputId] = useState(null);
            const [foodSuggestions, setFoodSuggestions] = useState([]);
            
            const [customWaterInput, setCustomWaterInput] = useState('');
            const [showCustomWaterInput, setShowCustomWaterInput] = useState(false);

            const touchRef = useRef(null);

            useEffect(() => {
                setQuote(QUOTES[Math.floor(Math.random() * QUOTES.length)]);
                if (lastActiveDate && lastActiveDate !== todayStr) {
                    const y = new Date(); y.setDate(y.getDate() - 1);
                    if (lastActiveDate !== toLocalDateStr(y)) setStreak(0);

                        {streak > 0 && activeTab === 'home' && (
                            <div className="flex justify-center mt-3">
                                <div className="flex items-center text-[1rem] font-black bg-[#FFF2CD] text-[#A66000] px-4 py-1.5 rounded-full border-2 border-[#FFE0B2] shadow-sm">
                                    連續陪伴 <span className="mx-1 text-[#E65100] text-xl">{streak}</span> 天 <span className="text-[#FF7043] ml-1 animate-bounce-slight">🔥</span>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="flex px-3 mt-2 mb-2 shrink-0 bg-white mx-4 rounded-full border-2 border-[#E5D5C5] shadow-sm p-1" role="tablist">
                        {TAB_DEFS.map(t => (
                            <button key={t.id} type="button" role="tab" aria-selected={activeTab === t.id} className={`btn-warm min-tap-target flex-1 py-2 text-[1rem] font-black transition-all rounded-full ${activeTab === t.id ? 'bg-[#FAF4EB] text-themeColor shadow-inner border border-[#E5D5C5]' : 'text-textMuted hover:text-textMain'}`} onClick={() => setActiveTab(t.id)}>
                                <i className={`fas ${t.icon} text-lg mb-1`}></i> <br className="block" />{t.label}
                            </button>
                        ))}
                    </div>

                    <div className="flex-1 overflow-y-auto px-5 pb-8 pt-3" role="tabpanel">
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'skincare' && renderSkincare()}
                        {activeTab === 'health' && renderHealth()}
                        {activeTab === 'diet' && renderDiet()}
                        
                        {/* Settings / Export block shown at the bottom of Home tab */}
                        {activeTab === 'home' && (
                             <div className="w-full mt-5 bg-[#FAF4EB] border-[3px] border-[#E5D5C5] rounded-[24px] p-5 shadow-sm">
                                <div className="flex justify-between items-center">
                                    <div className="text-[1rem] font-black text-textMain"><i className="fas fa-book mr-2 text-textMuted"></i>溫馨手帳備份</div>
                                    <div className="flex space-x-2">
                                        <button type="button" onClick={exportData} className="btn-warm bg-white text-textMain px-4 py-2 rounded-xl text-[1rem] font-black border-[3px] border-[#E5D5C5] shadow-sm active:bg-[#FAF4EB]">匯出</button>
                                        <label className="btn-warm flex items-center justify-center bg-themeColor text-white px-4 py-2 rounded-xl text-[1rem] font-black shadow-sm cursor-pointer active:scale-95">
                                            匯入 <input type="file" accept=".json,application/json" onChange={importData} className="sr-only" />
                                        </label>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
