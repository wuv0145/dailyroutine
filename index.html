<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Delicate Glow Up</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="./icon.jpg">
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        neonPink: '#ff2a85',
                        darkBg: '#0a0a0a',
                        cardBg: '#1a1a1a',
                        cardDark: '#121212'
                    },
                    animation: {
                        'float': 'float 3s ease-in-out infinite',
                        'pulse-glow': 'pulseGlow 2s cubic-bezier(0.4, 0, 0.6, 1) infinite'
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-15px)' }
                        },
                        pulseGlow: {
                            '0%, 100%': { opacity: 1, filter: 'drop-shadow(0 0 10px #ff2a85)' },
                            '50%': { opacity: .7, filter: 'drop-shadow(0 0 25px #ff2a85)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0a; color: #fff; font-family: 'PingFang TC', 'Heiti TC', sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        .neon-text-light { color: #ff2a85; text-shadow: 0 0 2px #ff2a85, 0 0 4px #ff2a85; }
        .neon-border { border: 1px solid #ff2a85; box-shadow: 0 0 3px #ff2a85, inset 0 0 3px #ff2a85; }
        .neon-bg { background-color: #ff2a85; box-shadow: 0 0 8px #ff2a85; color: white; }
        .neon-btn { transition: all 0.2s ease-in-out; }
        .neon-btn:active { transform: scale(0.95); }
        ::-webkit-scrollbar { display: none; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1) sepia(1) saturate(5) hue-rotate(300deg); }
        
        table { width: 100%; border-collapse: collapse; }
        th, td { border-bottom: 1px solid #333; padding: 12px 8px; text-align: left; }
        th { color: #888; font-size: 0.85rem; font-weight: normal; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect } = React;

        const ICONS = [
            { id: 'cleanser', icon: '🧼', name: '洗面乳' },
            { id: 'toner', icon: '🧴', name: '化妝水' },
            { id: 'serum', icon: '💧', name: '精華液' },
            { id: 'eyecream', icon: '👁️', name: '眼霜' },
            { id: 'lotion', icon: '🧴', name: '乳液/面霜' },
            { id: 'sunscreen', icon: '🛡️', name: '防曬' },
            { id: 'mask', icon: '🎭', name: '面膜' },
            { id: 'oil', icon: '🧪', name: '保養油' },
            { id: 'lipbalm', icon: '💄', name: '護唇膏' }
        ];

        // 更新為新的 6 隻寵物
        const PETS = {
            penguin: { name: '小企鵝', stages: ['🥚', '🐣', '🐧', '🐧❄️✨'] },
            bird: { name: '綠繡眼', stages: ['🥚', '🐣', '🐦', '🐦🌿✨'] },
            snail: { name: '小蝸牛', stages: ['🥚', '🌱', '🐌', '🐌🌈✨'] },
            sheep: { name: '小綿羊', stages: ['🥚', '🐑', '🐏', '🐑☁️✨'] },
            cat: { name: '星霓貓', stages: ['🥚', '🐱', '🐈', '😻✨'] },
            dog: { name: '幻光犬', stages: ['🥚', '🐶', '🐕', '🥰✨'] }
        };

        const EXP_PER_LEVEL = 20;

        const App = () => {
            const [date, setDate] = useState(new Date().toISOString().split('T')[0]);
            const [activeTab, setActiveTab] = useState('home'); // Default to home

            // --- Pet State ---
            const [petType, setPetType] = useState(() => localStorage.getItem('glowUpPetType') || 'penguin');
            const [petExp, setPetExp] = useState(() => parseInt(localStorage.getItem('glowUpPetExp')) || 0);
            
            // Notification State
            const [expNotice, setExpNotice] = useState('');

            // --- Skincare State ---
            const [time, setTime] = useState('morning');
            const [isEdit, setIsEdit] = useState(false);
            const [routines, setRoutines] = useState(() => {
                const saved = localStorage.getItem('glowUpRoutines');
                return saved ? JSON.parse(saved) : { morning: [], evening: [] };
            });
            const [logs, setLogs] = useState(() => {
                const saved = localStorage.getItem('glowUpLogs');
                return saved ? JSON.parse(saved) : {};
            });

            // --- Health State ---
            const [healthProfile, setHealthProfile] = useState(() => {
                const saved = localStorage.getItem('glowUpHealthProfile');
                return saved ? JSON.parse(saved) : { height: '' };
            });
            const [healthLogs, setHealthLogs] = useState(() => {
                const saved = localStorage.getItem('glowUpHealthLogs');
                return saved ? JSON.parse(saved) : {};
            });

            // --- Diet State ---
            const [dietLogs, setDietLogs] = useState(() => {
                const saved = localStorage.getItem('glowUpDietLogs');
                return saved ? JSON.parse(saved) : {};
            });

            // Save to localStorage
            useEffect(() => { localStorage.setItem('glowUpPetType', petType); }, [petType]);
            useEffect(() => { localStorage.setItem('glowUpPetExp', petExp.toString()); }, [petExp]);
            useEffect(() => { localStorage.setItem('glowUpRoutines', JSON.stringify(routines)); }, [routines]);
            useEffect(() => { localStorage.setItem('glowUpLogs', JSON.stringify(logs)); }, [logs]);
            useEffect(() => { localStorage.setItem('glowUpHealthProfile', JSON.stringify(healthProfile)); }, [healthProfile]);
            useEffect(() => { localStorage.setItem('glowUpHealthLogs', JSON.stringify(healthLogs)); }, [healthLogs]);
            useEffect(() => { localStorage.setItem('glowUpDietLogs', JSON.stringify(dietLogs)); }, [dietLogs]);

            // --- Exp Function ---
            const addExp = (amount, source) => {
                setPetExp(prev => prev + amount);
                setExpNotice(`+${amount} EXP (${source})`);
                setTimeout(() => setExpNotice(''), 2000);
            };

            // --- Pet Derived Data ---
            const level = Math.floor(petExp / EXP_PER_LEVEL) + 1;
            const currentExpInLevel = petExp % EXP_PER_LEVEL;
            const progress = (currentExpInLevel / EXP_PER_LEVEL) * 100;
            const stageIndex = level === 1 ? 0 : (level < 4 ? 1 : (level < 7 ? 2 : 3));
            const currentPet = PETS[petType] || PETS['penguin']; // Fallback in case old localstorage has invalid pet
            const petEmoji = currentPet.stages[stageIndex];
            
            // Dynamic Size based on level
            const getPetSize = () => {
                if (level === 1) return 'text-6xl';
                if (level < 4) return 'text-7xl';
                if (level < 7) return 'text-8xl';
                return 'text-9xl';
            };

            // --- Skincare Functions ---
            const addItem = (iconItem) => {
                const newItem = { id: Date.now().toString(), icon: iconItem.icon, name: iconItem.name, brand: '' };
                setRoutines(prev => ({ ...prev, [time]: [...prev[time], newItem] }));
            };
            const updateBrand = (id, val) => {
                setRoutines(prev => ({ ...prev, [time]: prev[time].map(item => item.id === id ? { ...item, brand: val } : item) }));
            };
            const deleteItem = (id) => {
                setRoutines(prev => ({ ...prev, [time]: prev[time].filter(item => item.id !== id) }));
            };
            const toggleLog = (itemId) => {
                setLogs(prev => {
                    const dayLogs = prev[date] || { morning: [], evening: [] };
                    const timeLogs = dayLogs[time] || [];
                    const isCompleted = timeLogs.includes(itemId);
                    const newTimeLogs = isCompleted ? timeLogs.filter(id => id !== itemId) : [...timeLogs, itemId];
                    
                    if (!isCompleted) addExp(2, '完成保養'); // Gain EXP on check
                    
                    return { ...prev, [date]: { ...dayLogs, [time]: newTimeLogs } };
                });
            };

            // --- Health Functions ---
            const updateHealthLog = (field, value) => {
                setHealthLogs(prev => ({
                    ...prev,
                    [date]: { ...(prev[date] || { weight: '', bodyFat: '' }), [field]: value }
                }));
            };
            const todayHealth = healthLogs[date] || { weight: '', bodyFat: '' };
            let bmi = '--';
            if (healthProfile.height && todayHealth.weight) {
                const h = parseFloat(healthProfile.height) / 100;
                const w = parseFloat(todayHealth.weight);
                if (h > 0 && w > 0) bmi = (w / (h * h)).toFixed(1);
            }

            // --- Diet Functions ---
            const todayDiet = dietLogs[date] || [];
            const addDietRow = () => {
                const newItem = { id: Date.now().toString(), meal: '午餐', food: '', calories: '' };
                setDietLogs(prev => ({ ...prev, [date]: [...(prev[date] || []), newItem] }));
                addExp(3, '新增飲食'); // Gain EXP on adding diet
            };
            const updateDietItem = (id, field, value) => {
                setDietLogs(prev => ({
                    ...prev,
                    [date]: (prev[date] || []).map(item => item.id === id ? { ...item, [field]: value } : item)
                }));
            };
            const deleteDietItem = (id) => {
                setDietLogs(prev => ({ ...prev, [date]: (prev[date] || []).filter(item => item.id !== id) }));
            };
            const totalCalories = todayDiet.reduce((sum, item) => sum + (parseFloat(item.calories) || 0), 0);

            // --- Renderers ---
            const renderHome = () => (
                <div className="animate-fade-in flex flex-col items-center h-full pt-4">
                    <div className="w-full bg-cardDark border border-gray-800 rounded-3xl p-6 flex flex-col items-center relative overflow-hidden shadow-[0_0_20px_rgba(255,42,133,0.05)]">
                        {/* Glow Background */}
                        <div className="absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-neonPink rounded-full opacity-10 blur-3xl"></div>
                        
                        <h2 className="text-gray-400 text-sm mb-6 z-10"><i className="fas fa-paw text-neonPink mr-2"></i>我的專屬寵物</h2>
                        
                        {/* Pet Display */}
                        <div className="h-40 flex items-center justify-center z-10 mb-4">
                            <div className={`animate-float drop-shadow-2xl ${level >= 7 ? 'animate-pulse-glow' : ''}`}>
                                <span className={getPetSize()}>{petEmoji}</span>
                            </div>
                        </div>
                        
                        {/* Level & Progress */}
                        <div className="w-full z-10">
                            <div className="flex justify-between items-end mb-2">
                                <span className="font-black text-xl text-white">Lv. {level} <span className="text-sm font-normal text-neonPink ml-1">{currentPet.name}</span></span>
                                <span className="text-xs text-gray-400">{currentExpInLevel} / {EXP_PER_LEVEL} EXP</span>
                            </div>
                            <div className="w-full bg-gray-900 rounded-full h-3 shadow-[inset_0_0_5px_rgba(0,0,0,1)]">
                                <div className="bg-neonPink h-3 rounded-full transition-all duration-500 ease-out shadow-[0_0_10px_#ff2a85]" style={{ width: `${progress}%` }}></div>
                            </div>
                            <p className="text-center text-xs text-gray-500 mt-4">
                                {level === 1 ? '多紀錄保養與健康來孵化牠吧！' : '每次記錄保養或飲食，寵物就會長大喔！'}
                            </p>
                        </div>
                    </div>

                    {/* Pet Selector - Changed to grid-cols-3 for 6 items */}
                    <div className="w-full mt-6 bg-cardBg rounded-2xl p-4 border border-gray-800">
                        <p className="text-xs text-gray-400 mb-3 text-center">切換寵物 (經驗值共通)</p>
                        <div className="grid grid-cols-3 gap-2">
                            {Object.entries(PETS).map(([key, pet]) => (
                                <button 
                                    key={key} 
                                    onClick={() => setPetType(key)}
                                    className={`flex flex-col items-center p-2 rounded-xl transition-all ${petType === key ? 'bg-pink-900/40 border border-neonPink shadow-[0_0_10px_rgba(255,42,133,0.3)]' : 'bg-darkBg border border-gray-800 text-gray-500 hover:border-gray-600'}`}
                                >
                                    <span className="text-2xl mb-1">{pet.stages[1]}</span>
                                    <span className="text-xs font-bold">{pet.name}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );

            const renderSkincare = () => {
                const currentRoutine = routines[time] || [];
                const currentLogs = (logs[date] && logs[date][time]) ? logs[date][time] : [];

                return (
                    <div className="flex flex-col h-full">
                        <div className="flex justify-between items-center mb-4">
                            <div className="flex bg-cardBg rounded-full p-1 flex-1 mr-4">
                                <button className={`flex-1 py-2 rounded-full font-bold text-sm neon-btn ${time === 'morning' ? 'neon-bg' : 'text-gray-400'}`} onClick={() => setTime('morning')}>早晨</button>
                                <button className={`flex-1 py-2 rounded-full font-bold text-sm neon-btn ${time === 'evening' ? 'neon-bg' : 'text-gray-400'}`} onClick={() => setTime('evening')}>夜間</button>
                            </div>
                            <button onClick={() => setIsEdit(!isEdit)} className="text-neonPink p-2 w-10 text-center">
                                {isEdit ? <i className="fas fa-check text-xl"></i> : <i className="fas fa-pen text-xl"></i>}
                            </button>
                        </div>

                        {isEdit && (
                            <div className="mb-6 bg-cardDark p-4 rounded-xl border border-gray-800 shadow-[0_0_10px_rgba(255,42,133,0.1)]">
                                <p className="text-xs text-gray-400 mb-3 text-center">點選下方圖示加入保養程序</p>
                                <div className="grid grid-cols-3 gap-2">
                                    {ICONS.map(i => (
                                        <button key={i.id} onClick={() => addItem(i)} className="flex flex-col items-center p-2 rounded-lg bg-cardBg border border-gray-800 hover:border-neonPink active:bg-neonPink transition-colors">
                                            <span className="text-xl mb-1">{i.icon}</span>
                                            <span className="text-xs text-gray-300 scale-90">{i.name}</span>
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto pb-10 space-y-3">
                            {currentRoutine.length === 0 ? (
                                <div className="text-center text-gray-500 mt-10 text-sm">{isEdit ? "請選擇保養品加入清單" : "目前沒有設定，請點擊右上角編輯"}</div>
                            ) : (
                                currentRoutine.map((item) => {
                                    const isCompleted = currentLogs.includes(item.id);
                                    return (
                                        <div key={item.id} className={`flex items-center p-3 rounded-xl transition-all ${isCompleted && !isEdit ? 'bg-pink-900/30 border border-neonPink/50' : 'bg-cardBg border border-gray-800'}`}>
                                            <div className="text-2xl mr-3">{item.icon}</div>
                                            <div className="flex-1">
                                                <div className="font-bold text-base">{item.name}</div>
                                                {isEdit ? (
                                                    <input type="text" placeholder="輸入品牌..." value={item.brand} onChange={(e) => updateBrand(item.id, e.target.value)} className="bg-darkBg text-xs px-2 py-1.5 rounded mt-1 w-full text-gray-200 focus:outline-none focus:border-neonPink border border-gray-700" />
                                                ) : (
                                                    <div className="text-xs text-gray-400 mt-1">{item.brand || '未設定品牌'}</div>
                                                )}
                                            </div>
                                            {isEdit ? (
                                                <button onClick={() => deleteItem(item.id)} className="ml-3 text-red-400 p-2 rounded-full bg-red-500/10"><i className="fas fa-trash text-sm"></i></button>
                                            ) : (
                                                <button onClick={() => toggleLog(item.id)} className={`ml-3 w-8 h-8 rounded-full flex items-center justify-center border transition-all ${isCompleted ? 'bg-neonPink border-neonPink text-white shadow-[0_0_8px_#ff2a85]' : 'border-gray-600 text-transparent'}`}><i className="fas fa-check text-xs"></i></button>
                                            )}
                                        </div>
                                    )
                                })
                            )}
                        </div>
                    </div>
                );
            };

            const renderHealth = () => (
                <div className="animate-fade-in space-y-6">
                    <div className="bg-cardBg p-5 rounded-2xl border border-gray-800">
                        <h2 className="text-sm text-gray-400 mb-4"><i className="fas fa-user mr-2 text-neonPink"></i>基本資料 (共用)</h2>
                        <div className="flex items-center justify-between">
                            <span className="text-base">身高 (cm)</span>
                            <input type="number" placeholder="例如: 160" value={healthProfile.height} onChange={(e) => setHealthProfile({height: e.target.value})} className="bg-darkBg w-24 text-right px-3 py-2 rounded-lg text-white border border-gray-700 focus:border-neonPink focus:outline-none" />
                        </div>
                    </div>

                    <div className="bg-cardBg p-5 rounded-2xl border border-neonPink/30 shadow-[0_0_15px_rgba(255,42,133,0.05)]">
                        <h2 className="text-sm text-gray-400 mb-4"><i className="fas fa-weight-scale mr-2 text-neonPink"></i>今日數值 ({date})</h2>
                        
                        <div className="space-y-4">
                            <div className="flex items-center justify-between">
                                <span className="text-base">體重 (kg)</span>
                                <input type="number" value={todayHealth.weight} onChange={(e) => updateHealthLog('weight', e.target.value)} onBlur={(e) => { if(e.target.value) addExp(1, '健康紀錄'); }} className="bg-darkBg w-24 text-right px-3 py-2 rounded-lg text-white border border-gray-700 focus:border-neonPink focus:outline-none" />
                            </div>
                            <div className="flex items-center justify-between">
                                <span className="text-base">體脂率 (%)</span>
                                <input type="number" value={todayHealth.bodyFat} onChange={(e) => updateHealthLog('bodyFat', e.target.value)} onBlur={(e) => { if(e.target.value) addExp(1, '健康紀錄'); }} className="bg-darkBg w-24 text-right px-3 py-2 rounded-lg text-white border border-gray-700 focus:border-neonPink focus:outline-none" />
                            </div>
                        </div>
                        
                        <div className="mt-6 pt-4 border-t border-gray-800 flex justify-between items-center">
                            <span className="text-gray-400">BMI 指數</span>
                            <span className="text-2xl font-black text-neonPink">{bmi}</span>
                        </div>
                    </div>
                </div>
            );

            const renderDiet = () => (
                <div className="animate-fade-in flex flex-col h-full">
                    <div className="bg-cardBg rounded-2xl border border-gray-800 p-4 mb-4">
                        <div className="flex justify-between items-center mb-2">
                            <h2 className="text-sm text-gray-400"><i className="fas fa-utensils mr-2 text-neonPink"></i>今日飲食 ({date})</h2>
                            <button onClick={addDietRow} className="text-neonPink text-sm border border-neonPink px-3 py-1 rounded-full hover:bg-neonPink hover:text-white transition-colors">
                                <i className="fas fa-plus mr-1"></i> 新增
                            </button>
                        </div>
                        
                        <div className="overflow-x-auto">
                            <table>
                                <thead>
                                    <tr>
                                        <th className="w-1/4">餐別</th>
                                        <th className="w-2/5">食物內容</th>
                                        <th className="w-1/4 text-right">熱量</th>
                                        <th className="w-10 text-center"></th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {todayDiet.map(item => (
                                        <tr key={item.id}>
                                            <td>
                                                <select value={item.meal} onChange={(e) => updateDietItem(item.id, 'meal', e.target.value)} className="bg-darkBg text-white border border-gray-700 rounded px-1 py-1.5 w-full text-xs focus:outline-none focus:border-neonPink">
                                                    <option>早餐</option>
                                                    <option>午餐</option>
                                                    <option>晚餐</option>
                                                    <option>點心</option>
                                                    <option>飲料</option>
                                                </select>
                                            </td>
                                            <td>
                                                <input type="text" placeholder="如: 蛋餅" value={item.food} onChange={(e) => updateDietItem(item.id, 'food', e.target.value)} className="bg-darkBg text-white border border-gray-700 rounded px-2 py-1.5 w-full text-xs focus:outline-none focus:border-neonPink" />
                                            </td>
                                            <td>
                                                <input type="number" placeholder="kcal" value={item.calories} onChange={(e) => updateDietItem(item.id, 'calories', e.target.value)} className="bg-darkBg text-white border border-gray-700 rounded px-2 py-1.5 w-full text-xs text-right focus:outline-none focus:border-neonPink" />
                                            </td>
                                            <td className="text-center">
                                                <button onClick={() => deleteDietItem(item.id)} className="text-red-400/70 hover:text-red-400 p-1"><i className="fas fa-times"></i></button>
                                            </td>
                                        </tr>
                                    ))}
                                    {todayDiet.length === 0 && (
                                        <tr><td colSpan="4" className="text-center text-gray-500 py-6 text-sm">尚未記錄今日飲食</td></tr>
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div className="bg-neonPink/10 border border-neonPink/50 rounded-xl p-4 flex justify-between items-center mt-auto">
                        <span className="font-bold text-gray-300">今日總熱量</span>
                        <div className="text-xl font-black text-neonPink">{totalCalories} <span className="text-xs font-normal text-gray-400">kcal</span></div>
                    </div>
                </div>
            );

            return (
                <div className="h-screen flex flex-col max-w-md mx-auto relative overflow-hidden bg-darkBg text-white">
                    {/* EXP Floating Notification */}
                    {expNotice && (
                        <div className="absolute top-16 left-1/2 transform -translate-x-1/2 z-50 bg-neonPink text-white px-4 py-1 rounded-full font-bold text-sm shadow-[0_0_15px_#ff2a85] animate-bounce">
                            {expNotice}
                        </div>
                    )}

                    {/* Header & Date */}
                    <div className="p-5 pb-2 shrink-0">
                        <h1 className="text-2xl font-black italic tracking-wider neon-text-light text-center mb-4">Delicate Glow Up</h1>
                        
                        <div className="flex justify-center">
                            <input 
                                type="date" 
                                value={date} 
                                onChange={(e) => setDate(e.target.value)}
                                className="bg-cardBg border border-gray-700 rounded-full px-5 py-2 text-center text-sm font-bold w-full max-w-[200px] focus:outline-none focus:border-neonPink"
                            />
                        </div>
                    </div>

                    {/* Tabs */}
                    <div className="flex px-5 mb-4 shrink-0 border-b border-gray-800">
                        <button className={`flex-1 pb-3 text-sm font-bold transition-all ${activeTab === 'home' ? 'text-neonPink border-b-2 border-neonPink' : 'text-gray-500'}`} onClick={() => setActiveTab('home')}><i className="fas fa-home mr-1"></i> 寵物</button>
                        <button className={`flex-1 pb-3 text-sm font-bold transition-all ${activeTab === 'skincare' ? 'text-neonPink border-b-2 border-neonPink' : 'text-gray-500'}`} onClick={() => setActiveTab('skincare')}><i className="fas fa-sparkles mr-1"></i> 保養</button>
                        <button className={`flex-1 pb-3 text-sm font-bold transition-all ${activeTab === 'health' ? 'text-neonPink border-b-2 border-neonPink' : 'text-gray-500'}`} onClick={() => setActiveTab('health')}><i className="fas fa-heart-pulse mr-1"></i> 健康</button>
                        <button className={`flex-1 pb-3 text-sm font-bold transition-all ${activeTab === 'diet' ? 'text-neonPink border-b-2 border-neonPink' : 'text-gray-500'}`} onClick={() => setActiveTab('diet')}><i className="fas fa-salad mr-1"></i> 飲食</button>
                    </div>

                    {/* Content Area */}
                    <div className="flex-1 overflow-y-auto px-5 pb-8">
                        {activeTab === 'home' && renderHome()}
                        {activeTab === 'skincare' && renderSkincare()}
                        {activeTab === 'health' && renderHealth()}
                        {activeTab === 'diet' && renderDiet()}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
